<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Struct alignment into 4-byte slots</title>
  <desc id="desc">The fields f1, padding, f2, f3, and padding are laid out in one continuous row of 12 bytes. Curly braces above the row group the bytes into slot 0, slot 1, and slot 2, four bytes each.</desc>
  <rect x="16" y="16" width="928" height="238" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#24292f">
    <text x="224" y="52" text-anchor="middle" font-size="17" font-weight="600">slot 0</text>
    <text x="480" y="52" text-anchor="middle" font-size="17" font-weight="600">slot 1</text>
    <text x="736" y="52" text-anchor="middle" font-size="17" font-weight="600">slot 2</text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 102 126 C 102 118 108 112 118 112 L 208 112 C 216 112 220 106 224 92 C 228 106 232 112 240 112 L 330 112 C 340 112 346 118 346 126"/>
    <path d="M 358 126 C 358 118 364 112 374 112 L 464 112 C 472 112 476 106 480 92 C 484 106 488 112 496 112 L 586 112 C 596 112 602 118 602 126"/>
    <path d="M 614 126 C 614 118 620 112 630 112 L 720 112 C 728 112 732 106 736 92 C 740 106 744 112 752 112 L 842 112 C 852 112 858 118 858 126"/>
  </g>

  <g stroke="#8c959f" stroke-width="1">
    <rect x="96" y="150" width="64" height="56" fill="#f2cc60"/>
    <rect x="160" y="150" width="64" height="56" fill="#ffffff"/>
    <rect x="224" y="150" width="64" height="56" fill="#ffffff"/>
    <rect x="288" y="150" width="64" height="56" fill="#ffffff"/>
    <rect x="352" y="150" width="64" height="56" fill="#2f81f7"/>
    <rect x="416" y="150" width="64" height="56" fill="#2f81f7"/>
    <rect x="480" y="150" width="64" height="56" fill="#2f81f7"/>
    <rect x="544" y="150" width="64" height="56" fill="#2f81f7"/>
    <rect x="608" y="150" width="64" height="56" fill="#f2cc60"/>
    <rect x="672" y="150" width="64" height="56" fill="#ffffff"/>
    <rect x="736" y="150" width="64" height="56" fill="#ffffff"/>
    <rect x="800" y="150" width="64" height="56" fill="#ffffff"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#24292f">
      <text x="128" y="174" font-size="14" font-weight="600">f1</text>
      <text x="128" y="193" font-size="12">1 byte</text>
      <text x="256" y="174" font-size="14" font-weight="600">padding</text>
      <text x="256" y="193" font-size="12">3 bytes</text>
      <text x="640" y="174" font-size="14" font-weight="600">f3</text>
      <text x="640" y="193" font-size="12">1 byte</text>
      <text x="768" y="174" font-size="14" font-weight="600">padding</text>
      <text x="768" y="193" font-size="12">3 bytes</text>
    </g>
    <g fill="#ffffff">
      <text x="480" y="174" font-size="14" font-weight="600">f2</text>
      <text x="480" y="193" font-size="12">4 bytes</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#24292f">
    <rect x="360" y="225" width="14" height="14" rx="3" fill="#f2cc60" stroke="#8c959f"/>
    <text x="382" y="237">uint8_t</text>
    <rect x="464" y="225" width="14" height="14" rx="3" fill="#2f81f7" stroke="#8c959f"/>
    <text x="486" y="237">int</text>
    <rect x="526" y="225" width="14" height="14" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="548" y="237">padding</text>
  </g>
</svg>
