<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="batteryTitle batteryDesc">
  <title id="batteryTitle">Charging a phone battery</title>
  <desc id="batteryDesc">A phone at 40 percent charges for 90 minutes and reaches the 100 percent limit.</desc>

  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3648"/>
      <stop offset="100%" stop-color="#16202e"/>
    </linearGradient>
    <linearGradient id="chargeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- phone 1 (initial state: 40%) -->
  <g transform="translate(40, 0)">
    <rect x="150" y="80" width="220" height="340" rx="28" fill="url(#phoneBody)" stroke="#64748b" stroke-width="3"/>
    <rect x="166" y="96" width="188" height="308" rx="16" fill="#0b1220" stroke="#0f172a" stroke-width="2"/>
    <rect x="240" y="96" width="40" height="10" rx="5" fill="#1e293b"/>
    <!-- battery icon -->
    <rect x="200" y="190" width="100" height="80" rx="8" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="300" y="215" width="14" height="30" rx="3" fill="#cbd5e1"/>
    <rect x="204" y="194" width="36.8" height="72" rx="3" fill="url(#chargeFill)"/>
    <text x="250" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#f59e0b">40%</text>
  </g>

  <!-- charging arrow -->
  <g>
    <!-- lightning bolt icon -->
    <polygon points="498,198 506,198 502,212 510,212 494,232 498,218 490,218" fill="#fbbf24"/>
    <line x1="430" y1="250" x2="570" y2="250" stroke="#64748b" stroke-width="3"/>
    <polygon points="570,242 584,250 570,258" fill="#64748b"/>
    <text x="500" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="600" fill="#cbd5e1">+90 min</text>
  </g>

  <!-- phone 2 (capped state: 100%) -->
  <g transform="translate(380, 0)">
    <rect x="150" y="80" width="220" height="340" rx="28" fill="url(#phoneBody)" stroke="#64748b" stroke-width="3"/>
    <rect x="166" y="96" width="188" height="308" rx="16" fill="#0b1220" stroke="#0f172a" stroke-width="2"/>
    <rect x="240" y="96" width="40" height="10" rx="5" fill="#1e293b"/>
    <!-- 100% cap line -->
    <line x1="196" y1="172" x2="304" y2="172" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="196" y1="166" x2="196" y2="178" stroke="#ef4444" stroke-width="2"/>
    <line x1="304" y1="166" x2="304" y2="178" stroke="#ef4444" stroke-width="2"/>
    <text x="250" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#f87171">100% cap</text>
    <!-- battery icon full -->
    <rect x="200" y="190" width="100" height="80" rx="8" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="300" y="215" width="14" height="30" rx="3" fill="#cbd5e1"/>
    <rect x="204" y="194" width="92" height="72" rx="3" fill="#22c55e"/>
    <text x="250" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="600" fill="#22c55e">100%</text>
  </g>
</svg>
