<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="piggyTitle piggyDesc">
  <title id="piggyTitle">Topping up a piggy bank with major and minor currency units and carry-over</title>
  <desc id="piggyDesc">A piggy bank holding 3 major coins and 75 minor coins receives 1 more major coin and 40 minor coins. Because minor coins cannot exceed 99, 100 minor coins carry over into 1 major coin, leaving unknown final counts.</desc>

  <defs>
    <linearGradient id="pigPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="goldCoin">
      <circle cx="0" cy="0" r="18" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#92400e" stroke-width="1.5"/>
    </g>
    <g id="silverCoin">
      <circle cx="0" cy="0" r="14" fill="#94a3b8" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Top-left: current piggy bank -->
  <g>
    <rect x="70" y="76" width="320" height="172" rx="18" fill="url(#pigPanel)" stroke="#334155" stroke-width="2"/>
    <text x="104" y="114" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">piggy bank</text>
    <rect x="262" y="90" width="104" height="32" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="314" y="111" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">1 : 100</text>

    <use href="#goldCoin" x="132" y="168"/>
    <text x="132" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">3</text>

    <text x="224" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#475569">+</text>

    <use href="#silverCoin" x="312" y="168"/>
    <text x="312" y="216" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e2e8f0">75</text>
  </g>

  <!-- Bottom-left: deposit -->
  <g>
    <rect x="70" y="272" width="320" height="172" rx="18" fill="url(#pigPanel)" stroke="#f59e0b" stroke-width="2"/>
    <text x="104" y="310" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">+ deposit</text>

    <use href="#goldCoin" x="132" y="364"/>
    <text x="132" y="412" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">+1</text>

    <text x="224" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#475569">+</text>

    <use href="#silverCoin" x="312" y="364"/>
    <text x="312" y="412" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e2e8f0">+40</text>
  </g>

  <!-- Center arrows into result -->
  <g>
    <path d="M 390 162 H 460 V 260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 390 358 H 460 V 260" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="460" y1="260" x2="508" y2="260" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="506,252 520,260 506,268" fill="#94a3b8"/>
  </g>

  <!-- Right result card with carry rule -->
  <g>
    <rect x="526" y="106" width="404" height="308" rx="20" fill="url(#pigPanel)" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="728" y="148" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="600" fill="#cbd5e1">normalized total</text>

    <!-- Carry arc from right coin box to left coin box -->
    <path d="M 812 206 Q 728 158 652 198" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>
    <polygon points="644,202 657,203 651,192" fill="#f59e0b"/>
    <rect x="688" y="160" width="84" height="28" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="730" y="179" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#fbbf24">100 → 1</text>

    <!-- Major coin unknown -->
    <g transform="translate(636 276)">
      <use href="#goldCoin" x="0" y="-40"/>
      <rect x="-56" y="-8" width="112" height="58" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="0" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#60a5fa">?</text>
    </g>

    <!-- Minor coin unknown (<= 99) -->
    <g transform="translate(820 276)">
      <use href="#silverCoin" x="0" y="-40"/>
      <rect x="-56" y="-8" width="112" height="58" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="0" y="29" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#60a5fa">?</text>
      <text x="0" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">max 99</text>
    </g>
  </g>
</svg>
