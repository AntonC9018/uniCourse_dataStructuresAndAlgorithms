<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="shelfTitle shelfDesc">
  <title id="shelfTitle">Putting the Atlas on a bookshelf and removing a book</title>
  <desc id="shelfDesc">A five-slot bookshelf. A book is being removed from slot 0, the Atlas is moving into slot 2, and slots 1 and 4 are empty. The number of empty slots is unknown.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4b63"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- bookshelf -->
  <g>
    <rect x="80" y="120" width="840" height="290" rx="10" fill="url(#panel)" stroke="#64748b" stroke-width="4"/>
    <line x1="80" y1="390" x2="920" y2="390" stroke="#64748b" stroke-width="6"/>
    <line x1="80" y1="404" x2="920" y2="404" stroke="#475569" stroke-width="4"/>

    <g stroke="#64748b" stroke-width="4">
      <line x1="248" y1="120" x2="248" y2="390"/>
      <line x1="416" y1="120" x2="416" y2="390"/>
      <line x1="584" y1="120" x2="584" y2="390"/>
      <line x1="752" y1="120" x2="752" y2="390"/>
    </g>

    <!-- slot 0: book being removed -->
    <g opacity="0.75">
      <rect x="120" y="260" width="100" height="130" rx="4" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
      <rect x="120" y="260" width="16" height="130" rx="4" fill="#7f1d1d"/>
      <g stroke="#fecaca" stroke-width="3" stroke-linecap="round">
        <line x1="148" y1="292" x2="204" y2="292"/>
        <line x1="148" y1="312" x2="188" y2="312"/>
      </g>
    </g>
    <g>
      <line x1="120" y1="325" x2="52" y2="325" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      <polygon points="52,315 36,325 52,335" fill="#ef4444"/>
    </g>

    <!-- slot 1: empty -->
    <rect x="286" y="300" width="92" height="90" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6"/>

    <!-- slot 2: Atlas moving in -->
    <g>
      <rect x="430" y="26" width="140" height="74" rx="5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
      <rect x="430" y="26" width="18" height="74" rx="5" fill="#1e3a8a"/>
      <text x="506" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#dbeafe">Atlas</text>

      <line x1="500" y1="110" x2="500" y2="158" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
      <polygon points="490,158 500,174 510,158" fill="#60a5fa"/>
    </g>

    <!-- slot 3: book -->
    <g>
      <rect x="618" y="260" width="100" height="130" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2"/>
      <rect x="618" y="260" width="16" height="130" rx="4" fill="#14532d"/>
      <g stroke="#bbf7d0" stroke-width="3" stroke-linecap="round">
        <line x1="646" y1="292" x2="702" y2="292"/>
        <line x1="646" y1="312" x2="686" y2="312"/>
      </g>
    </g>

    <!-- slot 4: empty -->
    <rect x="790" y="300" width="92" height="90" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 6"/>
  </g>

  <!-- slot numbers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b" text-anchor="middle">
    <text x="164" y="442">0</text>
    <text x="332" y="442">1</text>
    <text x="500" y="442">2</text>
    <text x="668" y="442">3</text>
    <text x="836" y="442">4</text>
  </g>

  <!-- unknown empty count -->
  <g>
    <circle cx="900" cy="478" r="22" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="900" y="487" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="600" fill="#94a3b8">?</text>
  </g>
</svg>
