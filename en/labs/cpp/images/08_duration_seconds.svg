<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="durTitle durDesc">
  <title id="durTitle">Converting hours, minutes, and seconds into total seconds</title>
  <desc id="durDesc">A duration of 2 hours, 15 minutes, and 30 seconds converts via multipliers 3600, 60, and 1 into an unknown total number of seconds.</desc>

  <defs>
    <linearGradient id="durPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: 3 time unit rows -->
  <g>
    <!-- Hours -->
    <rect x="70" y="88" width="480" height="92" rx="16" fill="url(#durPanel)" stroke="#f59e0b" stroke-width="2"/>
    <text x="122" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#fbbf24">2 h</text>
    <rect x="330" y="114" width="186" height="40" rx="10" fill="#78350f" opacity="0.55" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="423" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#fde68a">× 3600 s</text>

    <!-- Minutes -->
    <rect x="70" y="214" width="480" height="92" rx="16" fill="url(#durPanel)" stroke="#60a5fa" stroke-width="2"/>
    <text x="122" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#60a5fa">15 min</text>
    <rect x="330" y="240" width="186" height="40" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="423" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#60a5fa">× 60 s</text>

    <!-- Seconds -->
    <rect x="70" y="340" width="480" height="92" rx="16" fill="url(#durPanel)" stroke="#22c55e" stroke-width="2"/>
    <text x="122" y="394" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#4ade80">30 s</text>
    <rect x="330" y="366" width="186" height="40" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="423" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#4ade80">× 1 s</text>
  </g>

  <!-- Merging lines + plus badges -->
  <g>
    <path d="M 550 134 H 630 V 260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="550" y1="260" x2="674" y2="260" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 550 386 H 630 V 260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="672,252 686,260 672,268" fill="#94a3b8"/>

    <circle cx="630" cy="260" r="18" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="630" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#e2e8f0">+</text>
  </g>

  <!-- Right: Total seconds -->
  <g>
    <rect x="694" y="182" width="236" height="156" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="812" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#60a5fa">?</text>
    <text x="812" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">total seconds</text>
  </g>
</svg>
