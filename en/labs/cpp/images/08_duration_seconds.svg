<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="durTitle durDesc">
  <title id="durTitle">Converting hours, minutes, and seconds into total seconds example</title>
  <desc id="durDesc">A duration of 2 hours, 15 minutes, and 30 seconds converts into 8130 total seconds.</desc>

  <defs>
    <linearGradient id="durPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Duration panel (matching time.svg style) -->
  <rect x="110" y="110" width="320" height="300" rx="20" fill="url(#durPanel)" stroke="#334155" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="200" y="195" font-size="44" font-weight="600" fill="#fbbf24">2</text>
    <text x="242" y="195" font-size="24" fill="#94a3b8">h</text>

    <text x="200" y="275" font-size="44" font-weight="600" fill="#60a5fa">15</text>
    <text x="266" y="275" font-size="24" fill="#94a3b8">min</text>

    <text x="200" y="355" font-size="44" font-weight="600" fill="#4ade80">30</text>
    <text x="266" y="355" font-size="24" fill="#94a3b8">s</text>
  </g>

  <!-- Center arrow -->
  <g>
    <line x1="454" y1="260" x2="534" y2="260" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="532,251 548,260 532,269" fill="#64748b"/>
  </g>

  <!-- Right: Total seconds example -->
  <g>
    <rect x="570" y="150" width="320" height="220" rx="20" fill="url(#durPanel)" stroke="#22c55e" stroke-width="2.5"/>
    <text x="730" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#4ade80">8130</text>
    <text x="730" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#94a3b8">seconds</text>
  </g>
</svg>
