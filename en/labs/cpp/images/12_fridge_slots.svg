<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="fridgeTitle fridgeDesc">
  <title id="fridgeTitle">Pouring milk from a fridge slot into a cup</title>
  <desc id="fridgeDesc">A fridge with three slots holding bottles of 100, 300 and 200 millilitres. An arrow pours 120 millilitres from the second bottle into an empty cup.</desc>

  <defs>
    <linearGradient id="fridgeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3648"/>
      <stop offset="100%" stop-color="#16202e"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- fridge -->
  <g>
    <rect x="60" y="70" width="360" height="390" rx="18" fill="url(#fridgeBody)" stroke="#64748b" stroke-width="3"/>
    <rect x="76" y="84" width="328" height="362" rx="8" fill="#0b1220" stroke="#0f172a" stroke-width="2"/>

    <!-- shelves -->
    <line x1="76" y1="200" x2="404" y2="200" stroke="#475569" stroke-width="4"/>
    <line x1="76" y1="320" x2="404" y2="320" stroke="#475569" stroke-width="4"/>

    <!-- slot numbers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#64748b">
      <text x="92" y="122">0</text>
      <text x="92" y="242">1</text>
      <text x="92" y="362">2</text>
    </g>

    <!-- bottle slot 0: 100 ml -->
    <g>
      <rect x="222" y="92" width="16" height="10" rx="2" fill="#3b82f6"/>
      <rect x="226" y="102" width="8" height="18" fill="#64748b"/>
      <path d="M 200 120 H 260 L 270 140 V 196 H 190 V 140 Z" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <rect x="196" y="166" width="68" height="26" rx="3" fill="url(#milk)"/>
      <text x="230" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">100 ml</text>
    </g>

    <!-- bottle slot 1: 300 ml -->
    <g>
      <rect x="222" y="212" width="16" height="10" rx="2" fill="#3b82f6"/>
      <rect x="226" y="222" width="8" height="18" fill="#64748b"/>
      <path d="M 200 240 H 260 L 270 260 V 316 H 190 V 260 Z" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <rect x="196" y="250" width="68" height="62" rx="3" fill="url(#milk)"/>
      <text x="230" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">300 ml</text>
    </g>

    <!-- bottle slot 2: 200 ml -->
    <g>
      <rect x="222" y="332" width="16" height="10" rx="2" fill="#3b82f6"/>
      <rect x="226" y="342" width="8" height="18" fill="#64748b"/>
      <path d="M 200 360 H 260 L 270 380 V 436 H 190 V 380 Z" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <rect x="196" y="382" width="68" height="50" rx="3" fill="url(#milk)"/>
      <text x="230" y="410" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0f172a">200 ml</text>
    </g>
  </g>

  <!-- transfer arrow with a droplet -->
  <g>
    <path d="M 272 278 C 410 278 470 360 688 360" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <polygon points="688,350 704,360 688,370" fill="#60a5fa"/>

    <path d="M 470 214 C 470 214, 484 232, 484 241 A 14 14 0 0 1 456 241 C 456 232, 470 214, 470 214 Z" fill="#60a5fa"/>
    <path d="M 464 235 A 7 7 0 0 1 471 228" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <text x="470" y="292" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#e2e8f0">120 ml</text>
  </g>

  <!-- empty cup -->
  <g>
    <path d="M 730 300 H 850 L 834 432 H 746 Z" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <ellipse cx="790" cy="300" rx="60" ry="10" fill="#0b1220" stroke="#64748b" stroke-width="3"/>
    <path d="M 850 322 C 890 322 890 384 850 384" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="790" y="462" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">empty cup</text>
  </g>
</svg>
