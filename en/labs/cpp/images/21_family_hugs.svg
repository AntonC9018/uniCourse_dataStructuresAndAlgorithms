    <rect x="704" y="324" width="22" height="22" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.55"/>
    <rect x="731" y="324" width="22" height="22" rx="6" fill="#22d3ee"/>
