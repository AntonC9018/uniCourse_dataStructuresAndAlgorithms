    <rect x="811" y="324" width="22" height="22" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.55"/>
    <rect x="838" y="324" width="22" height="22" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.55"/>
    <rect x="865" y="324" width="22" height="22" rx="6" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.55"/>
    <rect x="892" y="324" width="22" height="22" rx="6" fill="#a78bfa"/>
    <rect x="919" y="324" width="22" height="22" rx="6" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.55"/>
