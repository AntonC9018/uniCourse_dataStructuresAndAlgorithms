  <g>
    <rect x="792" y="120" width="168" height="266" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <path d="M 842 258 Q 856 218 876 218 Q 896 218 910 258 Z" fill="#22d3ee"/>
    <circle cx="876" cy="190" r="26" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
