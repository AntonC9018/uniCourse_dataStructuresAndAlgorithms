<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="sort3Title sort3Desc">
  <title id="sort3Title">Sorting three numbers in ascending order using min, max, and sum</title>
  <desc id="sort3Desc">Three unsorted numbers 27, 9, and 18 pass through min, sum-minus-extremes, and max formulas to produce three sorted ascending slots.</desc>

  <defs>
    <linearGradient id="s3Panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Unsorted input trio on left -->
  <g>
    <rect x="70" y="96" width="230" height="328" rx="18" fill="url(#s3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="185" y="136" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">unsorted</text>

    <rect x="115" y="160" width="140" height="62" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="185" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#fbbf24">27</text>

    <rect x="115" y="240" width="140" height="62" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="185" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#4ade80">9</text>

    <rect x="115" y="320" width="140" height="62" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="185" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">18</text>
  </g>

  <!-- Middle: min / mid / max rules -->
  <g>
    <line x1="300" y1="260" x2="344" y2="260" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="342,252 356,260 342,268" fill="#64748b"/>

    <rect x="364" y="96" width="290" height="96" rx="14" fill="url(#s3Panel)" stroke="#22c55e" stroke-width="2"/>
    <text x="392" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">min</text>
    <text x="392" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">min(a, min(b, c))</text>

    <rect x="364" y="212" width="290" height="96" rx="14" fill="url(#s3Panel)" stroke="#60a5fa" stroke-width="2"/>
    <text x="392" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#60a5fa">mid</text>
    <text x="392" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">(a + b + c) − min − max</text>

    <rect x="364" y="328" width="290" height="96" rx="14" fill="url(#s3Panel)" stroke="#f59e0b" stroke-width="2"/>
    <text x="392" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#fbbf24">max</text>
    <text x="392" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1">max(a, max(b, c))</text>
  </g>

  <!-- Right: Sorted ascending slots -->
  <g>
    <line x1="654" y1="144" x2="722" y2="144" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="720,137 732,144 720,151" fill="#22c55e"/>

    <line x1="654" y1="260" x2="722" y2="260" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="720,253 732,260 720,267" fill="#60a5fa"/>

    <line x1="654" y1="376" x2="722" y2="376" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="720,369 732,376 720,383" fill="#f59e0b"/>

    <rect x="740" y="96" width="190" height="328" rx="18" fill="url(#s3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="835" y="134" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">ascending</text>

    <rect x="780" y="156" width="110" height="54" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="835" y="191" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">?</text>

    <text x="835" y="232" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">≤</text>

    <rect x="780" y="246" width="110" height="54" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="835" y="281" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">?</text>

    <text x="835" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">≤</text>

    <rect x="780" y="336" width="110" height="54" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="835" y="371" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#60a5fa">?</text>
  </g>
</svg>
