<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="calTitle calDesc">
  <title id="calTitle">Computing the calorie content of a dish from protein, fat, and carbohydrates</title>
  <desc id="calDesc">A dish with three macronutrient cards: 20 grams of protein at 4 kcal per gram, 10 grams of fat at 9 kcal per gram, and 35 grams of carbs at 4 kcal per gram, combining into an unknown total calorie count.</desc>

  <defs>
    <linearGradient id="calPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Plate / dish on the left -->
  <g transform="translate(170 260)">
    <circle cx="0" cy="0" r="98" fill="url(#calPanel)" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="68" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- Three macro wedges on plate -->
    <path d="M 0 0 L 0 -52 A 52 52 0 0 1 45 26 Z" fill="#3b82f6" opacity="0.85"/>
    <path d="M 0 0 L 45 26 A 52 52 0 0 1 -45 26 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M 0 0 L -45 26 A 52 52 0 0 1 0 -52 Z" fill="#22c55e" opacity="0.85"/>
    <text x="0" y="132" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">dish</text>
  </g>

  <!-- Three nutrient rows in the center -->
  <g>
    <!-- Protein -->
    <rect x="330" y="88" width="320" height="92" rx="16" fill="url(#calPanel)" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="366" cy="134" r="14" fill="#3b82f6"/>
    <text x="396" y="128" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">protein</text>
    <text x="396" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">20 g</text>
    <rect x="518" y="114" width="110" height="40" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="573" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#60a5fa">4 kcal/g</text>

    <!-- Fat -->
    <rect x="330" y="214" width="320" height="92" rx="16" fill="url(#calPanel)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="366" cy="260" r="14" fill="#f59e0b"/>
    <text x="396" y="254" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">fat</text>
    <text x="396" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">10 g</text>
    <rect x="518" y="240" width="110" height="40" rx="10" fill="#78350f" opacity="0.55" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="573" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#fbbf24">9 kcal/g</text>

    <!-- Carbs -->
    <rect x="330" y="340" width="320" height="92" rx="16" fill="url(#calPanel)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="366" cy="386" r="14" fill="#22c55e"/>
    <text x="396" y="380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">carbs</text>
    <text x="396" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">35 g</text>
    <rect x="518" y="366" width="110" height="40" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
    <text x="573" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#4ade80">4 kcal/g</text>
  </g>

  <!-- Merging lines + total kcal box -->
  <g>
    <path d="M 650 134 H 706 V 260" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="650" y1="260" x2="736" y2="260" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 650 386 H 706 V 260" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <polygon points="734,252 748,260 734,268" fill="#94a3b8"/>

    <rect x="754" y="194" width="180" height="132" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="844" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#60a5fa">?</text>
    <text x="844" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#94a3b8">kcal</text>
  </g>
</svg>
