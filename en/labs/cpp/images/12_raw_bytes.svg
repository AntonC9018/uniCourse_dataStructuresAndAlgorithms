<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="bytesTitle bytesDesc">
  <title id="bytesTitle">Storing a coin and a measurement in a raw byte buffer</title>
  <desc id="bytesDesc">A coin and a measurement wait above a fixed buffer of 64 bytes. A position cursor marks the start of the buffer, and a question mark shows that the used byte count is unknown.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- objects waiting to be stored -->
  <g>
    <rect x="300" y="56" width="400" height="150" rx="18" fill="url(#panel)" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- coin -->
    <g>
      <circle cx="400" cy="124" r="36" fill="url(#coin)" stroke="#b45309" stroke-width="3"/>
      <circle cx="400" cy="124" r="27" fill="none" stroke="#b45309" stroke-width="2"/>
      <text x="400" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#78350f">C</text>
    </g>
    <text x="400" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94a3b8">coin</text>

    <!-- measurement -->
    <g>
      <rect x="564" y="88" width="72" height="72" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
      <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
        <line x1="576" y1="96" x2="576" y2="112"/>
        <line x1="588" y1="96" x2="588" y2="106"/>
        <line x1="600" y1="96" x2="600" y2="112"/>
        <line x1="612" y1="96" x2="612" y2="106"/>
        <line x1="624" y1="96" x2="624" y2="112"/>
      </g>
      <path d="M 576 128 L 624 128 L 624 144 L 576 144 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <line x1="600" y1="128" x2="600" y2="144" stroke="#f59e0b" stroke-width="2"/>
    </g>
    <text x="600" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94a3b8">measurement</text>
  </g>

  <!-- down arrow -->
  <g>
    <line x1="500" y1="210" x2="500" y2="284" stroke="#64748b" stroke-width="3"/>
    <polygon points="492,284 500,298 508,284" fill="#64748b"/>
  </g>

  <!-- byte buffer -->
  <g>
    <text x="920" y="300" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#94a3b8">64 bytes</text>

    <rect x="80" y="312" width="840" height="78" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <g stroke="#334155" stroke-width="1.5">
      <line x1="132.5" y1="312" x2="132.5" y2="390"/>
      <line x1="185" y1="312" x2="185" y2="390"/>
      <line x1="237.5" y1="312" x2="237.5" y2="390"/>
      <line x1="290" y1="312" x2="290" y2="390"/>
      <line x1="342.5" y1="312" x2="342.5" y2="390"/>
      <line x1="395" y1="312" x2="395" y2="390"/>
      <line x1="447.5" y1="312" x2="447.5" y2="390"/>
      <line x1="500" y1="312" x2="500" y2="390"/>
      <line x1="552.5" y1="312" x2="552.5" y2="390"/>
      <line x1="605" y1="312" x2="605" y2="390"/>
      <line x1="657.5" y1="312" x2="657.5" y2="390"/>
      <line x1="710" y1="312" x2="710" y2="390"/>
      <line x1="762.5" y1="312" x2="762.5" y2="390"/>
      <line x1="815" y1="312" x2="815" y2="390"/>
      <line x1="867.5" y1="312" x2="867.5" y2="390"/>
    </g>

    <text x="92" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">0</text>
    <text x="908" y="332" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">63</text>
    <text x="500" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#475569">. . .</text>

    <!-- position cursor -->
    <g>
      <polygon points="80,310 72,296 88,296" fill="#f59e0b"/>
      <line x1="80" y1="296" x2="80" y2="282" stroke="#f59e0b" stroke-width="2"/>
      <text x="80" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#f59e0b">position</text>
    </g>

    <!-- unknown used byte count -->
    <g>
      <path d="M 80 392 V 426 H 290 V 392" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="185" cy="446" r="18" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="185" y="454" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#60a5fa">?</text>
    </g>
  </g>
</svg>
