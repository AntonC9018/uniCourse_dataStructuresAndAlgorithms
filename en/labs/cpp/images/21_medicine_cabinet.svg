<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="medTitle medDesc">
  <title id="medTitle">Checking and throwing away an expired medicine box</title>
  <desc id="medDesc">A medicine cabinet holds four boxes marked fresh or expired. Box 1 is selected to check whether it can be used and thrown into the trash bin if expired.</desc>

  <defs>
    <linearGradient id="cabPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="medBox">
      <rect x="0" y="0" width="90" height="72" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
      <rect x="38" y="18" width="14" height="36" rx="3" fill="#ef4444"/>
      <rect x="27" y="29" width="36" height="14" rx="3" fill="#ef4444"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- medicine cabinet -->
  <rect x="60" y="80" width="600" height="360" rx="18" fill="url(#cabPanel)" stroke="#334155" stroke-width="2"/>

  <!-- box 0: fresh -->
  <g>
    <rect x="90" y="110" width="120" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="150" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">0</text>
    <use href="#medBox" transform="translate(105 162)"/>
    <rect x="108" y="264" width="84" height="30" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
    <text x="150" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#4ade80">fresh</text>
  </g>

  <!-- box 1: expired, selected -->
  <g>
    <rect x="230" y="110" width="120" height="220" rx="12" fill="#78350f" opacity="0.28"/>
    <rect x="230" y="110" width="120" height="220" rx="12" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="290" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#fbbf24">1</text>
    <use href="#medBox" transform="translate(245 162)"/>
    <rect x="244" y="264" width="92" height="30" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
    <text x="290" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f87171">expired</text>
  </g>

  <!-- box 2: fresh -->
  <g>
    <rect x="370" y="110" width="120" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="430" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">2</text>
    <use href="#medBox" transform="translate(385 162)"/>
    <rect x="388" y="264" width="84" height="30" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
    <text x="430" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#4ade80">fresh</text>
  </g>

  <!-- box 3: expired -->
  <g>
    <rect x="510" y="110" width="120" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="570" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">3</text>
    <use href="#medBox" transform="translate(525 162)"/>
    <rect x="524" y="264" width="92" height="30" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
    <text x="570" y="285" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#f87171">expired</text>
  </g>

  <!-- usable? check -->
  <g>
    <rect x="200" y="358" width="180" height="52" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="262" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">usable?</text>
    <text x="342" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">?</text>
  </g>

  <!-- discard arrow to trash bin -->
  <path d="M 290 110 V 48 H 820 V 146" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <polygon points="811,144 820,160 829,144" fill="#ef4444"/>

  <!-- trash bin -->
  <g transform="translate(740 170)">
    <rect x="20" y="26" width="120" height="150" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <rect x="8" y="10" width="144" height="20" rx="6" fill="#334155" stroke="#64748b" stroke-width="2.5"/>
    <rect x="60" y="0" width="40" height="12" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <g stroke="#475569" stroke-width="4" stroke-linecap="round">
      <line x1="52" y1="54" x2="52" y2="150"/>
      <line x1="80" y1="54" x2="80" y2="150"/>
      <line x1="108" y1="54" x2="108" y2="150"/>
    </g>
  </g>
</svg>
