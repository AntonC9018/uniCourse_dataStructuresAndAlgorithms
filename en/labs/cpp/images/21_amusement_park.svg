<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="parkTitle parkDesc">
  <title id="parkTitle">Visitors picking preferred free attractions in an amusement park</title>
  <desc id="parkDesc">Three attractions are shown on the right: ferris, coaster and carousel. Visitors on the left each rank all three attractions and have a quota of four rides. A visitor takes the first free preferred attraction or waits when busy.</desc>

  <defs>
    <linearGradient id="parkPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="iconFerris">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#60a5fa"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#60a5fa" stroke-width="1.5"/>
    </g>
    <g id="iconCoaster">
      <path d="M -14 10 Q -4 -14 4 2 Q 10 12 16 -8" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="iconCarousel">
      <polygon points="-14,0 14,0 0,-12" fill="#4ade80"/>
      <line x1="-10" y1="0" x2="-10" y2="12" stroke="#4ade80" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#4ade80" stroke-width="2"/>
      <line x1="10" y1="0" x2="10" y2="12" stroke="#4ade80" stroke-width="2"/>
      <line x1="-14" y1="12" x2="14" y2="12" stroke="#4ade80" stroke-width="2.5"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- visitors on left -->
  <rect x="50" y="56" width="380" height="408" rx="18" fill="url(#parkPanel)" stroke="#334155" stroke-width="2"/>

  <!-- visitor 0: riding coaster -->
  <g>
    <rect x="74" y="82" width="332" height="106" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="110" cy="120" r="16" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <text x="110" y="158" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">v0</text>
    <!-- quota 2/4 -->
    <g transform="translate(150 104)">
      <circle cx="0" cy="0" r="5" fill="#fbbf24"/>
      <circle cx="16" cy="0" r="5" fill="#fbbf24"/>
      <circle cx="32" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <text x="68" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">2/4</text>
    </g>
    <!-- preference rank -->
    <rect x="148" y="122" width="42" height="42" rx="8" fill="#132033" stroke="#f59e0b" stroke-width="2"/>
    <use href="#iconCoaster" transform="translate(169 143)"/>
    <rect x="200" y="122" width="42" height="42" rx="8" fill="#132033" stroke="#334155" stroke-width="1.5"/>
    <use href="#iconFerris" transform="translate(221 143)"/>
    <rect x="252" y="122" width="42" height="42" rx="8" fill="#132033" stroke="#334155" stroke-width="1.5"/>
    <use href="#iconCarousel" transform="translate(273 143)"/>
  </g>

  <!-- visitor 1: picks 2nd preference (carousel) since coaster is busy -->
  <g>
    <rect x="74" y="206" width="332" height="106" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <circle cx="110" cy="244" r="16" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <text x="110" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#4ade80">v1</text>
    <g transform="translate(150 228)">
      <circle cx="0" cy="0" r="5" fill="#4ade80"/>
      <circle cx="16" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="32" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <text x="68" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">1/4</text>
    </g>
    <rect x="148" y="246" width="42" height="42" rx="8" fill="#132033" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <use href="#iconCoaster" transform="translate(169 267)" opacity="0.5"/>
    <rect x="200" y="246" width="42" height="42" rx="8" fill="#132033" stroke="#4ade80" stroke-width="2"/>
    <use href="#iconCarousel" transform="translate(221 267)"/>
    <rect x="252" y="246" width="42" height="42" rx="8" fill="#132033" stroke="#334155" stroke-width="1.5"/>
    <use href="#iconFerris" transform="translate(273 267)"/>
  </g>

  <!-- visitor 2: picks ferris -->
  <g>
    <rect x="74" y="330" width="332" height="106" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="110" cy="368" r="16" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <text x="110" y="406" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">v2</text>
    <g transform="translate(150 352)">
      <circle cx="0" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="16" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="32" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <circle cx="48" cy="0" r="5" fill="none" stroke="#64748b" stroke-width="1.8"/>
      <text x="68" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">0/4</text>
    </g>
    <rect x="148" y="370" width="42" height="42" rx="8" fill="#132033" stroke="#60a5fa" stroke-width="2"/>
    <use href="#iconFerris" transform="translate(169 391)"/>
    <rect x="200" y="370" width="42" height="42" rx="8" fill="#132033" stroke="#334155" stroke-width="1.5"/>
    <use href="#iconCoaster" transform="translate(221 391)"/>
    <rect x="252" y="370" width="42" height="42" rx="8" fill="#132033" stroke="#334155" stroke-width="1.5"/>
    <use href="#iconCarousel" transform="translate(273 391)"/>
  </g>

  <!-- 3 attractions on right -->
  <rect x="570" y="56" width="380" height="408" rx="18" fill="url(#parkPanel)" stroke="#334155" stroke-width="2"/>

  <!-- attraction 0: coaster (busy) -->
  <g>
    <rect x="596" y="82" width="328" height="106" rx="12" fill="#78350f" opacity="0.25"/>
    <rect x="596" y="82" width="328" height="106" rx="12" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <use href="#iconCoaster" transform="translate(646 135) scale(1.6)"/>
    <text x="698" y="130" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#fbbf24">coaster</text>
    <text x="698" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">rider: v0</text>
  </g>

  <!-- attraction 1: carousel (free -> v1) -->
  <g>
    <rect x="596" y="206" width="328" height="106" rx="12" fill="#052e16" opacity="0.4"/>
    <rect x="596" y="206" width="328" height="106" rx="12" fill="none" stroke="#22c55e" stroke-width="2"/>
    <use href="#iconCarousel" transform="translate(646 259) scale(1.5)"/>
    <text x="698" y="254" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#4ade80">carousel</text>
    <text x="698" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">free → v1</text>
  </g>

  <!-- attraction 2: ferris (free -> v2) -->
  <g>
    <rect x="596" y="330" width="328" height="106" rx="12" fill="#172554" opacity="0.45"/>
    <rect x="596" y="330" width="328" height="106" rx="12" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <use href="#iconFerris" transform="translate(646 383) scale(1.5)"/>
    <text x="698" y="378" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#60a5fa">ferris</text>
    <text x="698" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">free → v2</text>
  </g>

  <!-- matching arrows -->
  <line x1="406" y1="135" x2="580" y2="135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="580,126 596,135 580,144" fill="#f59e0b"/>

  <line x1="406" y1="259" x2="580" y2="259" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <polygon points="580,250 596,259 580,268" fill="#4ade80"/>

  <line x1="406" y1="383" x2="580" y2="383" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="580,374 596,383 580,392" fill="#60a5fa"/>
</svg>
