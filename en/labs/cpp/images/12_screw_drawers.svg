<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="drawersTitle drawersDesc">
  <title id="drawersTitle">Moving screws from one cabinet drawer to an empty drawer</title>
  <desc id="drawersDesc">A cabinet with four drawers. The third drawer holds screws and is selected, the fourth drawer is empty, and an arrow shows all screws moving from the third drawer into the fourth.</desc>

  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4b63"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="drawerFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- cabinet -->
  <rect x="50" y="180" width="900" height="250" rx="12" fill="url(#cabinet)" stroke="#64748b" stroke-width="3"/>

  <!-- drawer 0 -->
  <g>
    <rect x="66" y="196" width="205" height="218" rx="8" fill="url(#drawerFront)" stroke="#475569" stroke-width="2"/>
    <rect x="138" y="210" width="60" height="10" rx="5" fill="#64748b"/>
    <g fill="#cbd5e1" stroke="#64748b" stroke-width="1.5">
      <circle cx="106" cy="270" r="10"/><circle cx="146" cy="270" r="10"/>
      <circle cx="186" cy="270" r="10"/><circle cx="226" cy="270" r="10"/>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="100" y1="266" x2="112" y2="274"/><line x1="140" y1="266" x2="152" y2="274"/>
      <line x1="180" y1="266" x2="192" y2="274"/><line x1="220" y1="266" x2="232" y2="274"/>
    </g>
  </g>

  <!-- drawer 1 -->
  <g>
    <rect x="287" y="196" width="205" height="218" rx="8" fill="url(#drawerFront)" stroke="#475569" stroke-width="2"/>
    <rect x="359" y="210" width="60" height="10" rx="5" fill="#64748b"/>
    <g fill="#cbd5e1" stroke="#64748b" stroke-width="1.5">
      <circle cx="346" cy="270" r="10"/><circle cx="406" cy="270" r="10"/>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="340" y1="266" x2="352" y2="274"/><line x1="400" y1="266" x2="412" y2="274"/>
    </g>
  </g>

  <!-- drawer 2, selected source -->
  <g>
    <rect x="508" y="196" width="205" height="218" rx="8" fill="#78350f" opacity="0.25"/>
    <rect x="508" y="196" width="205" height="218" rx="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <rect x="580" y="210" width="60" height="10" rx="5" fill="#f59e0b"/>
    <g fill="#fbbf24" stroke="#b45309" stroke-width="1.5">
      <circle cx="547" cy="270" r="10"/><circle cx="587" cy="270" r="10"/><circle cx="627" cy="270" r="10"/><circle cx="667" cy="270" r="10"/>
      <circle cx="567" cy="310" r="10"/><circle cx="607" cy="310" r="10"/>
    </g>
    <g stroke="#b45309" stroke-width="2" stroke-linecap="round">
      <line x1="541" y1="266" x2="553" y2="274"/><line x1="581" y1="266" x2="593" y2="274"/>
      <line x1="621" y1="266" x2="633" y2="274"/><line x1="661" y1="266" x2="673" y2="274"/>
      <line x1="561" y1="306" x2="573" y2="314"/><line x1="601" y1="306" x2="613" y2="314"/>
    </g>
  </g>

  <!-- drawer 3, empty target -->
  <g>
    <rect x="729" y="196" width="205" height="218" rx="8" fill="url(#drawerFront)" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8 6"/>
    <rect x="801" y="210" width="60" height="10" rx="5" fill="#3b82f6"/>
  </g>

  <!-- move arrow -->
  <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
    <path d="M 610 150 C 660 90 800 90 831 158" fill="none"/>
  </g>
  <polygon points="831,180 821,160 841,160" fill="#60a5fa"/>

  <!-- drawer numbers -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64748b" text-anchor="middle">
    <text x="168" y="470">0</text>
    <text x="389" y="470">1</text>
    <text x="610" y="470">2</text>
    <text x="831" y="470">3</text>
  </g>
</svg>
