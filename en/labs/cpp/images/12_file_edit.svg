<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="fileEditTitle fileEditDesc">
  <title id="fileEditTitle">Adding characters to a line of a file and swapping two lines</title>
  <desc id="fileEditDesc">A file of five lines with their character counts. The third line, user equals admin, is selected and eight characters are about to be added to it. The first and fifth lines are marked for swapping.</desc>

  <defs>
    <linearGradient id="filePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- file -->
  <rect x="70" y="60" width="860" height="390" rx="16" fill="url(#filePanel)" stroke="#334155" stroke-width="2"/>

  <!-- column labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">
    <text x="150" y="100" text-anchor="end">line</text>
    <text x="178" y="100">text</text>
    <text x="812" y="100" text-anchor="end">chars</text>
  </g>

  <!-- line 0, marked for swap -->
  <g>
    <rect x="90" y="116" width="820" height="56" rx="10" fill="#172554" opacity="0.7"/>
    <rect x="90" y="116" width="820" height="56" rx="10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="150" y="151" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">0</text>
    <text x="178" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">host = localhost</text>
    <text x="812" y="151" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">16</text>
  </g>

  <!-- line 1 -->
  <g>
    <text x="150" y="215" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">1</text>
    <text x="178" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">port = 8080</text>
    <text x="812" y="215" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">11</text>
  </g>

  <!-- line 2, selected for insertion -->
  <g>
    <rect x="90" y="244" width="820" height="56" rx="10" fill="#78350f" opacity="0.3"/>
    <rect x="90" y="244" width="820" height="56" rx="10" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="150" y="279" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">2</text>
    <text x="178" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">user = admin</text>
    <line x1="330" y1="255" x2="330" y2="289" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="338" y="254" width="116" height="36" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="396" y="279" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#fbbf24">istrator</text>
    <text x="812" y="279" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">12</text>
  </g>

  <!-- line 3 -->
  <g>
    <text x="150" y="343" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">3</text>
    <text x="178" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">pass = 1234</text>
    <text x="812" y="343" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">11</text>
  </g>

  <!-- line 4, marked for swap -->
  <g>
    <rect x="90" y="372" width="820" height="56" rx="10" fill="#172554" opacity="0.7"/>
    <rect x="90" y="372" width="820" height="56" rx="10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="150" y="407" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">4</text>
    <text x="178" y="407" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">debug = false</text>
    <text x="812" y="407" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">13</text>
  </g>

  <!-- swap sign between lines 0 and 4 -->
  <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round">
    <line x1="858" y1="140" x2="858" y2="404"/>
    <line x1="886" y1="404" x2="886" y2="140"/>
  </g>
  <g fill="#3b82f6">
    <polygon points="849,392 858,410 867,392"/>
    <polygon points="877,152 886,134 895,152"/>
  </g>
</svg>
