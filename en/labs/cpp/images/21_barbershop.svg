<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="barberTitle barberDesc">
  <title id="barberTitle">Simulating a barbershop</title>
  <desc id="barberDesc">A queue with four chairs holds alice and bob. Two workers point to the same clients. A clock ticks one minute while a worker cuts hair and another is idle.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- clock tick -->
  <g>
    <circle cx="500" cy="70" r="30" fill="url(#panel)" stroke="#64748b" stroke-width="3"/>
    <line x1="500" y1="70" x2="500" y2="52" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="500" y1="70" x2="516" y2="78" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="500" cy="70" r="4" fill="#e2e8f0"/>
    <path d="M 534 48 A 44 44 0 0 1 534 92" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="534,42 546,48 534,54" fill="#f59e0b"/>
    <text x="552" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#f59e0b">1 min</text>
  </g>

  <!-- queue chairs -->
  <g>
    <!-- chair 0 -->
    <g>
      <rect x="75" y="340" width="80" height="16" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <rect x="75" y="290" width="10" height="56" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <line x1="82" y1="356" x2="82" y2="392" stroke="#475569" stroke-width="4"/>
      <line x1="148" y1="356" x2="148" y2="392" stroke="#475569" stroke-width="4"/>
    </g>
    <!-- chair 1 -->
    <g>
      <rect x="170" y="340" width="80" height="16" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <rect x="170" y="290" width="10" height="56" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <line x1="177" y1="356" x2="177" y2="392" stroke="#475569" stroke-width="4"/>
      <line x1="243" y1="356" x2="243" y2="392" stroke="#475569" stroke-width="4"/>
    </g>
    <!-- empty chairs -->
    <g>
      <rect x="265" y="340" width="80" height="16" rx="5" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="265" y="290" width="10" height="56" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="272" y1="356" x2="272" y2="392" stroke="#475569" stroke-width="3" stroke-dasharray="5 4"/>
      <line x1="338" y1="356" x2="338" y2="392" stroke="#475569" stroke-width="3" stroke-dasharray="5 4"/>
    </g>
    <g>
      <rect x="360" y="340" width="80" height="16" rx="5" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="360" y="290" width="10" height="56" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="367" y1="356" x2="367" y2="392" stroke="#475569" stroke-width="3" stroke-dasharray="5 4"/>
      <line x1="433" y1="356" x2="433" y2="392" stroke="#475569" stroke-width="3" stroke-dasharray="5 4"/>
    </g>
  </g>

  <!-- alice card -->
  <g>
    <rect x="75" y="190" width="80" height="140" rx="10" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <circle cx="115" cy="224" r="15" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 95 258 Q 115 238 135 258" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="115" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">alice</text>
    <g>
      <rect x="92" y="294" width="12" height="8" rx="2" fill="#f59e0b"/>
      <rect x="107" y="294" width="12" height="8" rx="2" fill="#f59e0b"/>
      <rect x="122" y="294" width="12" height="8" rx="2" fill="#334155"/>
    </g>
    <text x="115" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">2 min</text>
  </g>

  <!-- bob card -->
  <g>
    <rect x="170" y="190" width="80" height="140" rx="10" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <circle cx="210" cy="224" r="15" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 190 258 Q 210 238 230 258" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="210" y="278" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">bob</text>
    <g>
      <rect x="187" y="294" width="12" height="8" rx="2" fill="#f59e0b"/>
      <rect x="202" y="294" width="12" height="8" rx="2" fill="#f59e0b"/>
      <rect x="217" y="294" width="12" height="8" rx="2" fill="#f59e0b"/>
    </g>
    <text x="210" y="320" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8">3 min</text>
  </g>

  <!-- worker 1 -->
  <g>
    <rect x="600" y="330" width="80" height="16" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="600" y="280" width="10" height="56" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <line x1="607" y1="346" x2="607" y2="382" stroke="#475569" stroke-width="4"/>
    <line x1="673" y1="346" x2="673" y2="382" stroke="#475569" stroke-width="4"/>

    <circle cx="640" cy="210" r="16" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 618 250 Q 640 226 662 250 L 662 280 H 618 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

    <!-- scissors -->
    <g stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round">
      <line x1="658" y1="238" x2="680" y2="258"/>
      <line x1="680" y1="238" x2="658" y2="258"/>
    </g>
    <circle cx="682" cy="260" r="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="656" cy="260" r="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <text x="640" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">worker 1</text>
  </g>

  <!-- worker 2 -->
  <g>
    <rect x="790" y="330" width="80" height="16" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="790" y="280" width="10" height="56" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <line x1="797" y1="346" x2="797" y2="382" stroke="#475569" stroke-width="4"/>
    <line x1="863" y1="346" x2="863" y2="382" stroke="#475569" stroke-width="4"/>

    <circle cx="830" cy="210" r="16" fill="#f8d7b3" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 808 250 Q 830 226 852 250 L 852 280 H 808 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

    <text x="830" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">worker 2</text>

    <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="866" y="190">z</text>
      <text x="876" y="176">z</text>
      <text x="886" y="162">z</text>
    </g>
  </g>

  <!-- pointer from worker 1 to alice -->
  <g fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.85">
    <path d="M 618 240 V 170 H 115 V 186"/>
  </g>
  <g fill="#f59e0b">
    <polygon points="107,186 115,198 123,186"/>
  </g>
</svg>
