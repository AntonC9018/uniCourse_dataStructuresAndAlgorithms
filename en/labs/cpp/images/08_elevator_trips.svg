<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="elevTitle elevDesc">
  <title id="elevTitle">Counting elevator trips needed for N people with capacity K</title>
  <desc id="elevDesc">Ten people waiting on a floor next to an elevator cabin that fits four people at a time require 3 trips when the last trip may be partially full.</desc>

  <defs>
    <linearGradient id="elvPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="personDot">
      <circle cx="0" cy="-12" r="9" fill="#f8d7b3" stroke="#b45309" stroke-width="1.2"/>
      <path d="M -13 12 Q 0 -3 13 12 Z" fill="#3b82f6" stroke="#60a5fa" stroke-width="1.2"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: 10 waiting people on floor -->
  <g>
    <rect x="70" y="96" width="320" height="328" rx="18" fill="url(#elvPanel)" stroke="#334155" stroke-width="2"/>
    <text x="230" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#e2e8f0">10 waiting</text>

    <!-- 10 people in 2 rows of 5 -->
    <g transform="translate(134 218)">
      <use href="#personDot" x="0" y="0"/>
      <use href="#personDot" x="48" y="0"/>
      <use href="#personDot" x="96" y="0"/>
      <use href="#personDot" x="144" y="0"/>
      <use href="#personDot" x="192" y="0"/>

      <use href="#personDot" x="0" y="72"/>
      <use href="#personDot" x="48" y="72"/>
      <use href="#personDot" x="96" y="72"/>
      <use href="#personDot" x="144" y="72"/>
      <use href="#personDot" x="192" y="72"/>
    </g>

    <!-- Floor line -->
    <line x1="104" y1="352" x2="356" y2="352" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <text x="230" y="388" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94a3b8">floor queue</text>
  </g>

  <!-- Center: Elevator cabin holding K = 4 -->
  <g>
    <line x1="406" y1="260" x2="446" y2="260" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="444,252 458,260 444,268" fill="#f59e0b"/>

    <!-- Elevator shaft cable -->
    <line x1="575" y1="54" x2="575" y2="120" stroke="#64748b" stroke-width="3"/>
    <polygon points="565,86 575,68 585,86" fill="#4ade80"/>

    <!-- Elevator cabin -->
    <rect x="466" y="120" width="218" height="280" rx="18" fill="url(#elvPanel)" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="575" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">max 4</text>

    <!-- 4 slots in cabin -->
    <rect x="498" y="190" width="154" height="140" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <use href="#personDot" x="542" y="238"/>
    <use href="#personDot" x="608" y="238"/>
    <use href="#personDot" x="542" y="294"/>
    <use href="#personDot" x="608" y="294"/>

    <text x="575" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">last may be partial</text>
  </g>

  <!-- Right: Trips count 3 -->
  <g>
    <line x1="696" y1="260" x2="736" y2="260" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <polygon points="734,252 748,260 734,268" fill="#22c55e"/>

    <rect x="756" y="176" width="174" height="168" rx="20" fill="url(#elvPanel)" stroke="#22c55e" stroke-width="2.5"/>
    <text x="843" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="700" fill="#4ade80">3</text>
    <text x="843" y="308" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">trips</text>
  </g>
</svg>
