<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="buffTitle buffDesc">
  <title id="buffTitle">Giving a player a shield buff before a fight and removing it afterwards</title>
  <desc id="buffDesc">A player holds a pointer to an active buff. Before the fight the pointer points to a shield buff; after the fight the pointer is cleared to null.</desc>

  <defs>
    <linearGradient id="buffPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="shieldToken">
      <path d="M 0 -26 L 24 -16 V 4 C 24 20 0 30 0 30 C 0 30 -24 20 -24 4 V -16 Z" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
      <path d="M 0 -17 L 15 -10 V 3 C 15 13 0 20 0 20 Z" fill="#3b82f6" opacity="0.45"/>
    </g>
    <g id="crossedSwords" stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="-16" y1="-16" x2="16" y2="16"/>
      <line x1="16" y1="-16" x2="-16" y2="16"/>
      <line x1="-18" y1="8" x2="-8" y2="18"/>
      <line x1="18" y1="8" x2="8" y2="18"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- before fight panel -->
  <g>
    <rect x="60" y="64" width="880" height="178" rx="18" fill="url(#buffPanel)" stroke="#334155" stroke-width="2"/>
    <text x="92" y="102" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">before fight</text>

    <!-- player -->
    <rect x="92" y="122" width="290" height="94" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="136" cy="160" r="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 114 200 Q 136 178 158 200" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="176" y="160" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">player</text>
    <rect x="176" y="172" width="186" height="30" rx="7" fill="#132033" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="269" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">activeBuff*</text>

    <!-- pointer arrow -->
    <line x1="382" y1="169" x2="548" y2="169" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="548,160 564,169 548,178" fill="#f59e0b"/>

    <!-- shield buff -->
    <rect x="564" y="114" width="334" height="106" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2.5"/>
    <use href="#shieldToken" transform="translate(620 164)"/>
    <text x="676" y="162" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">shield buff</text>
    <text x="676" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#60a5fa">+1 shield</text>
  </g>

  <!-- fight separator -->
  <g transform="translate(500 264)">
    <rect x="-66" y="-20" width="132" height="40" rx="20" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <use href="#crossedSwords" transform="translate(-32 0) scale(0.75)"/>
    <text x="18" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">fight</text>
  </g>

  <!-- after fight panel -->
  <g>
    <rect x="60" y="294" width="880" height="178" rx="18" fill="url(#buffPanel)" stroke="#334155" stroke-width="2"/>
    <text x="92" y="332" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">after fight</text>

    <!-- player -->
    <rect x="92" y="352" width="290" height="94" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="136" cy="390" r="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 114 430 Q 136 408 158 430" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="176" y="390" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">player</text>
    <rect x="176" y="402" width="186" height="30" rx="7" fill="#132033" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="269" y="422" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">nullptr</text>

    <!-- cleared link -->
    <line x1="382" y1="399" x2="548" y2="399" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 5"/>
    <g transform="translate(465 399)" stroke="#ef4444" stroke-width="3" stroke-linecap="round">
      <line x1="-10" y1="-10" x2="10" y2="10"/>
      <line x1="10" y1="-10" x2="-10" y2="10"/>
    </g>

    <!-- buff inactive -->
    <rect x="564" y="344" width="334" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" opacity="0.5"/>
    <use href="#shieldToken" transform="translate(620 394)" opacity="0.5"/>
    <text x="676" y="392" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#64748b">shield buff</text>
    <text x="676" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">detached</text>
  </g>
</svg>
