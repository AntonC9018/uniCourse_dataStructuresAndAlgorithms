<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="bakeryTitle bakeryDesc">
  <title id="bakeryTitle">Preparing batches from a recipe at a bakery</title>
  <desc id="bakeryDesc">Three recipe cards each list flour and sugar per batch. The middle recipe is selected for three batches. Flour and sugar come from the store into the oven, and the finished batch counter is unknown.</desc>

  <defs>
    <linearGradient id="bakeryPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="ovenBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- recipe cards -->
  <g>
    <!-- recipe 1 -->
    <rect x="70" y="60" width="230" height="130" rx="14" fill="url(#bakeryPanel)" stroke="#334155" stroke-width="2"/>
    <path d="M 95 86 H 105 L 108 94 H 92 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="88" y="94" width="24" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="124" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e2e8f0">flour</text>
    <text x="284" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">200 g</text>
    <path d="M 95 142 H 105 L 108 150 H 92 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="88" y="150" width="24" height="20" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#64748b">
      <rect x="92" y="154" width="5" height="5" rx="1"/>
      <rect x="99" y="154" width="5" height="5" rx="1"/>
      <rect x="95" y="161" width="5" height="5" rx="1"/>
    </g>
    <text x="124" y="164" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e2e8f0">sugar</text>
    <text x="284" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">50 g</text>

    <!-- recipe 2, selected -->
    <rect x="330" y="60" width="230" height="130" rx="14" fill="#78350f" opacity="0.3"/>
    <rect x="330" y="60" width="230" height="130" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M 355 86 H 365 L 368 94 H 352 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="348" y="94" width="24" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="384" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#fbbf24">flour</text>
    <text x="544" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">150 g</text>
    <path d="M 355 142 H 365 L 368 150 H 352 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="348" y="150" width="24" height="20" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#64748b">
      <rect x="352" y="154" width="5" height="5" rx="1"/>
      <rect x="359" y="154" width="5" height="5" rx="1"/>
      <rect x="355" y="161" width="5" height="5" rx="1"/>
    </g>
    <text x="384" y="164" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#fbbf24">sugar</text>
    <text x="544" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">80 g</text>

    <!-- recipe 3 -->
    <rect x="590" y="60" width="230" height="130" rx="14" fill="url(#bakeryPanel)" stroke="#334155" stroke-width="2"/>
    <path d="M 615 86 H 625 L 628 94 H 612 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="608" y="94" width="24" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="644" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e2e8f0">flour</text>
    <text x="804" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">300 g</text>
    <path d="M 615 142 H 625 L 628 150 H 612 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="608" y="150" width="24" height="20" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#64748b">
      <rect x="612" y="154" width="5" height="5" rx="1"/>
      <rect x="619" y="154" width="5" height="5" rx="1"/>
      <rect x="615" y="161" width="5" height="5" rx="1"/>
    </g>
    <text x="644" y="164" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#e2e8f0">sugar</text>
    <text x="804" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">40 g</text>
  </g>

  <!-- selected recipe arrow with batch count -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <line x1="445" y1="198" x2="445" y2="252"/>
  </g>
  <polygon points="436,252 445,268 454,252" fill="#f59e0b"/>
  <g>
    <rect x="411" y="210" width="68" height="32" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="445" y="233" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fbbf24">×3</text>
  </g>

  <!-- ingredient store -->
  <g>
    <!-- flour sack -->
    <g>
      <path d="M 102 300 H 138 L 148 322 H 92 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <rect x="84" y="322" width="72" height="104" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <text x="120" y="382" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#334155">2000 g</text>
      <text x="120" y="456" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#94a3b8">flour</text>
    </g>
    <!-- sugar sack -->
    <g>
      <path d="M 200 300 H 236 L 246 322 H 190 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
      <rect x="182" y="322" width="72" height="104" rx="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
      <g fill="#64748b">
        <rect x="203" y="336" width="8" height="8" rx="1"/>
        <rect x="214" y="336" width="8" height="8" rx="1"/>
        <rect x="225" y="336" width="8" height="8" rx="1"/>
        <rect x="208" y="347" width="8" height="8" rx="1"/>
        <rect x="219" y="347" width="8" height="8" rx="1"/>
        <rect x="214" y="358" width="8" height="8" rx="1"/>
      </g>
      <text x="218" y="390" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#334155">800 g</text>
      <text x="218" y="456" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#94a3b8">sugar</text>
    </g>
  </g>

  <!-- arrow from store to oven -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="266" y1="366" x2="404" y2="366"/>
  </g>
  <polygon points="404,357 420,366 404,375" fill="#94a3b8"/>

  <!-- oven -->
  <g>
    <rect x="420" y="280" width="200" height="160" rx="14" fill="url(#ovenBody)" stroke="#64748b" stroke-width="3"/>
    <rect x="438" y="300" width="164" height="86" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <g fill="#f59e0b">
      <rect x="456" y="352" width="36" height="20" rx="6"/>
      <rect x="502" y="352" width="36" height="20" rx="6"/>
      <rect x="548" y="352" width="36" height="20" rx="6"/>
    </g>
    <circle cx="520" cy="412" r="12" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <line x1="520" y1="412" x2="520" y2="404" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- arrow from oven to finished counter -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="620" y1="366" x2="684" y2="366"/>
  </g>
  <polygon points="684,357 700,366 684,375" fill="#94a3b8"/>

  <!-- finished batch counter -->
  <g>
    <rect x="700" y="300" width="200" height="120" rx="14" fill="url(#bakeryPanel)" stroke="#334155" stroke-width="2"/>
    <circle cx="800" cy="360" r="30" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="800" y="371" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#60a5fa">?</text>
  </g>
</svg>
