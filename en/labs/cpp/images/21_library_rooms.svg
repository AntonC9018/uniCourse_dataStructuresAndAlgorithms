<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="libRoomsTitle libRoomsDesc">
  <title id="libRoomsTitle">Putting the Atlas into the first empty slot of room 1</title>
  <desc id="libRoomsDesc">A library has two rooms with three book slots each. Room 1 has a book in slot 0, an empty slot at index 1 and a book in slot 2. The Atlas moves into slot 1 of room 1.</desc>

  <defs>
    <linearGradient id="libPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="bookGreen">
      <rect x="0" y="0" width="76" height="106" rx="4" fill="#15803d" stroke="#14532d" stroke-width="2"/>
      <rect x="0" y="0" width="13" height="106" rx="4" fill="#14532d"/>
      <line x1="24" y1="26" x2="64" y2="26" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="42" x2="52" y2="42" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bookRed">
      <rect x="0" y="0" width="76" height="106" rx="4" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
      <rect x="0" y="0" width="13" height="106" rx="4" fill="#7f1d1d"/>
      <line x1="24" y1="26" x2="64" y2="26" stroke="#fecaca" stroke-width="3" stroke-linecap="round"/>
      <line x1="24" y1="42" x2="52" y2="42" stroke="#fecaca" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Atlas book above room 1 -->
  <g>
    <rect x="650" y="28" width="140" height="72" rx="5" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="650" y="28" width="18" height="72" rx="5" fill="#1e3a8a"/>
    <text x="728" y="72" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#dbeafe">Atlas</text>

    <line x1="720" y1="108" x2="720" y2="210" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <polygon points="710,208 720,224 730,208" fill="#60a5fa"/>
  </g>

  <!-- room 0 -->
  <g>
    <rect x="60" y="130" width="420" height="310" rx="16" fill="url(#libPanel)" stroke="#334155" stroke-width="2"/>
    <text x="88" y="166" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">room 0</text>
    <line x1="88" y1="364" x2="452" y2="364" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="104" y="274" width="76" height="90" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
    <use href="#bookGreen" transform="translate(232 258)"/>
    <rect x="360" y="274" width="76" height="90" rx="4" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b" text-anchor="middle">
      <text x="142" y="400">0</text>
      <text x="270" y="400">1</text>
      <text x="398" y="400">2</text>
    </g>
  </g>

  <!-- room 1, target -->
  <g>
    <rect x="510" y="130" width="420" height="310" rx="16" fill="url(#libPanel)" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="538" y="166" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#fbbf24">room 1</text>
    <line x1="538" y1="364" x2="902" y2="364" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <use href="#bookRed" transform="translate(554 258)"/>
    <rect x="682" y="274" width="76" height="90" rx="4" fill="#172554" opacity="0.5" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="6 5"/>
    <use href="#bookGreen" transform="translate(810 258)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8" text-anchor="middle">
      <text x="592" y="400">0</text>
      <text x="720" y="400" fill="#60a5fa" font-weight="700">1</text>
      <text x="848" y="400">2</text>
    </g>
  </g>
</svg>
