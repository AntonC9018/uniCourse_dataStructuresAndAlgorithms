<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="bottleTitle bottleDesc">
  <title id="bottleTitle">Pouring water from one bottle into another</title>
  <desc id="bottleDesc">A bottle holding 600 ml of water pours into another bottle holding 300 ml with an 800 ml capacity and 500 ml of free space.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="bottleAClip">
      <rect x="183" y="133" width="154" height="284" rx="24"/>
    </clipPath>
    <clipPath id="bottleBClip">
      <rect x="643" y="133" width="154" height="284" rx="24"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- bottle A (pouring from) -->
  <g>
    <ellipse cx="260" cy="432" rx="92" ry="10" fill="#000000" opacity="0.4"/>
    <text x="260" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">capacity: 1000 ml</text>
    <rect x="235" y="74" width="50" height="20" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="242" y="94" width="36" height="38" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <rect x="180" y="130" width="160" height="290" rx="26" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <g clip-path="url(#bottleAClip)">
      <!-- 600/1000 = 60% full (174px from bottom 417 -> y=243) -->
      <rect x="183" y="246" width="154" height="174" fill="url(#water)" opacity="0.9"/>
      <ellipse cx="260" cy="246" rx="76" ry="8" fill="#60a5fa" opacity="0.5"/>
    </g>
    <rect x="196" y="150" width="10" height="250" rx="5" fill="#ffffff" opacity="0.08"/>
    <text x="260" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#e2e8f0">600 ml</text>
  </g>

  <!-- pour stream / arrow -->
  <g>
    <path d="M350 250 C 440 230, 480 230, 560 250" fill="none" stroke="#60a5fa" stroke-width="4" stroke-dasharray="8 6"/>
    <polygon points="560,242 576,252 560,262" fill="#60a5fa"/>
    <!-- water droplet icon -->
    <path d="M460 216 C 460 216, 470 230, 470 236 A 10 10 0 0 1 450 236 C 450 230, 460 216, 460 216 Z" fill="#60a5fa"/>
  </g>

  <!-- bottle B (pouring into) -->
  <g>
    <ellipse cx="720" cy="432" rx="92" ry="10" fill="#000000" opacity="0.4"/>
    <text x="720" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">capacity: 800 ml</text>
    <rect x="695" y="74" width="50" height="20" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="702" y="94" width="36" height="38" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <rect x="640" y="130" width="160" height="290" rx="26" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <g clip-path="url(#bottleBClip)">
      <!-- 300/800 = 37.5% full (108px from bottom 417 -> y=309) -->
      <rect x="643" y="311" width="154" height="108" fill="url(#water)" opacity="0.9"/>
      <ellipse cx="720" cy="311" rx="76" ry="8" fill="#60a5fa" opacity="0.5"/>
    </g>
    <rect x="656" y="150" width="10" height="250" rx="5" fill="#ffffff" opacity="0.08"/>
    <text x="720" y="375" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="600" fill="#e2e8f0">300 ml</text>

    <!-- free space bracket -->
    <path d="M815 133 C 825 133 825 141 825 151 L 825 212 C 825 220 830 222 837 222 C 830 222 825 224 825 232 L 825 293 C 825 303 825 311 815 311" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <text x="850" y="227" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" fill="#60a5fa">free 500 ml</text>
  </g>
</svg>
