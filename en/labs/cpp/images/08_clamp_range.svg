<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="clampTitle clampDesc">
  <title id="clampTitle">Clamping values into an immutable allowed range</title>
  <desc id="clampDesc">A number line with a fixed allowed green interval from low 10 to high 50: value 4 is clamped right to 10, value 28 stays unchanged inside, and value 75 is clamped left to 50.</desc>

  <defs>
    <linearGradient id="clmPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <rect x="70" y="70" width="860" height="380" rx="20" fill="url(#clmPanel)" stroke="#334155" stroke-width="2"/>

  <!-- Top immutable range pill -->
  <g>
    <rect x="350" y="100" width="300" height="44" rx="22" fill="#052e16" opacity="0.65" stroke="#22c55e" stroke-width="2"/>
    <text x="500" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">[low 10, high 50] 🔒</text>
  </g>

  <!-- Main horizontal number line -->
  <line x1="120" y1="300" x2="880" y2="300" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Allowed green highlight zone [300 .. 700] -->
  <rect x="300" y="282" width="400" height="36" rx="8" fill="#22c55e" opacity="0.22"/>
  <line x1="300" y1="300" x2="700" y2="300" stroke="#22c55e" stroke-width="6"/>

  <!-- Boundary brackets at low=300 and high=700 -->
  <line x1="300" y1="256" x2="300" y2="344" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="376" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">low = 10</text>

  <line x1="700" y1="256" x2="700" y2="344" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <text x="700" y="376" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">high = 50</text>

  <!-- Sample 1: 4 -> clamped right to 10 -->
  <g>
    <circle cx="170" cy="224" r="22" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="170" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">4</text>
    <path d="M 196 224 H 284" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="282,217 294,224 282,231" fill="#f59e0b"/>
  </g>

  <!-- Sample 2: 28 inside -> stays -->
  <g>
    <circle cx="480" cy="224" r="22" fill="#052e16" stroke="#22c55e" stroke-width="2.5"/>
    <text x="480" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#4ade80">28</text>
    <line x1="480" y1="248" x2="480" y2="288" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Sample 3: 75 -> clamped left to 50 -->
  <g>
    <circle cx="830" cy="224" r="22" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="830" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">75</text>
    <path d="M 804 224 H 716" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="718,217 706,224 718,231" fill="#f59e0b"/>
  </g>

  <!-- Clamped result note -->
  <text x="500" y="422" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8">x &lt; low → low    |    low ≤ x ≤ high → x    |    x &gt; high → high</text>
</svg>
