<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="clampTitle clampDesc">
  <title id="clampTitle">Clamping values into an immutable allowed range</title>
  <desc id="clampDesc">A number line with a fixed allowed green interval from low 10 to high 50: example value 4 moves right to 10, 28 stays 28 inside the interval, and 75 moves left to 50.</desc>

  <defs>
    <linearGradient id="clmPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <rect x="70" y="70" width="860" height="380" rx="20" fill="url(#clmPanel)" stroke="#334155" stroke-width="2"/>

  <!-- Top immutable range pill -->
  <g>
    <rect x="350" y="106" width="300" height="44" rx="22" fill="#052e16" opacity="0.65" stroke="#22c55e" stroke-width="2"/>
    <text x="500" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">[low 10, high 50] 🔒</text>
  </g>

  <!-- Main horizontal number line -->
  <line x1="120" y1="312" x2="880" y2="312" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Allowed green highlight zone [300 .. 700] -->
  <rect x="300" y="294" width="400" height="36" rx="8" fill="#22c55e" opacity="0.22"/>
  <line x1="300" y1="312" x2="700" y2="312" stroke="#22c55e" stroke-width="6"/>

  <!-- Boundary brackets at low=300 and high=700 -->
  <line x1="300" y1="268" x2="300" y2="356" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">low = 10</text>

  <line x1="700" y1="268" x2="700" y2="356" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  <text x="700" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#4ade80">high = 50</text>

  <!-- Sample 1: 4 -> clamped right to 10 -->
  <g>
    <circle cx="164" cy="236" r="24" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="164" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">4</text>
    <path d="M 192 236 H 264" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="262,229 274,236 262,243" fill="#f59e0b"/>
    <circle cx="300" cy="236" r="22" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="300" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#4ade80">10</text>
  </g>

  <!-- Sample 2: 28 inside -> stays 28 -->
  <g>
    <circle cx="480" cy="236" r="24" fill="#052e16" stroke="#22c55e" stroke-width="2.5"/>
    <text x="480" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#4ade80">28</text>
    <line x1="480" y1="262" x2="480" y2="300" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Sample 3: 75 -> clamped left to 50 -->
  <g>
    <circle cx="836" cy="236" r="24" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="836" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#fbbf24">75</text>
    <path d="M 808 236 H 736" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="738,229 726,236 738,243" fill="#f59e0b"/>
    <circle cx="700" cy="236" r="22" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="700" y="243" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#4ade80">50</text>
  </g>
</svg>
