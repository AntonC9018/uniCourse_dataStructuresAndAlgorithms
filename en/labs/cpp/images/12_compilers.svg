<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="compileTitle compileDesc">
  <title id="compileTitle">Compiling source code at full optimization</title>
  <desc id="compileDesc">A source file with 101 lines feeds two compilers, MSVC and GCC, both set to the full optimization level. Each compiler produces machine code with an unknown instruction count.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- source file -->
  <g>
    <path d="M 74 130 H 270 L 310 170 V 396 Q 310 410 296 410 H 74 Q 60 410 60 396 V 144 Q 60 130 74 130 Z" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <path d="M 270 130 L 310 170 H 280 Q 270 170 270 160 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <g fill="#475569">
      <rect x="90" y="196" width="150" height="7" rx="3.5"/>
      <rect x="90" y="220" width="110" height="7" rx="3.5"/>
      <rect x="90" y="244" width="170" height="7" rx="3.5"/>
      <rect x="90" y="268" width="96" height="7" rx="3.5"/>
      <rect x="90" y="292" width="138" height="7" rx="3.5"/>
      <rect x="90" y="316" width="120" height="7" rx="3.5"/>
      <rect x="90" y="340" width="164" height="7" rx="3.5"/>
      <rect x="90" y="364" width="80" height="7" rx="3.5"/>
    </g>

    <text x="185" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#e2e8f0">101 lines</text>
  </g>

  <!-- split to the two compilers -->
  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M 318 270 H 350"/>
    <path d="M 350 165 V 355"/>
    <path d="M 350 165 H 382"/>
    <path d="M 350 355 H 382"/>
  </g>
  <g fill="#64748b">
    <polygon points="382,157 394,165 382,173"/>
    <polygon points="382,347 394,355 382,363"/>
  </g>

  <!-- MSVC compiler -->
  <g>
    <rect x="394" y="90" width="196" height="150" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <text x="416" y="127" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">MSVC</text>

    <!-- three-level selector, set to full -->
    <line x1="548" y1="146" x2="548" y2="206" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <circle cx="548" cy="146" r="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="548" cy="176" r="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="548" cy="206" r="8" fill="#f59e0b"/>
  </g>

  <!-- GCC compiler -->
  <g>
    <rect x="394" y="280" width="196" height="150" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <text x="416" y="317" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">GCC</text>

    <!-- three-level selector, set to full -->
    <line x1="548" y1="336" x2="548" y2="396" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <circle cx="548" cy="336" r="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="548" cy="366" r="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="548" cy="396" r="8" fill="#f59e0b"/>
  </g>

  <!-- compiler to output arrows -->
  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M 590 165 H 644"/>
    <path d="M 590 355 H 644"/>
  </g>
  <g fill="#64748b">
    <polygon points="644,157 656,165 644,173"/>
    <polygon points="644,347 656,355 644,363"/>
  </g>

  <!-- MSVC output -->
  <g>
    <rect x="660" y="100" width="280" height="120" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="680" y="128" width="26" height="34" rx="4"/>
      <rect x="714" y="128" width="26" height="34" rx="4"/>
      <rect x="748" y="128" width="26" height="34" rx="4"/>
      <rect x="782" y="128" width="26" height="34" rx="4"/>
      <rect x="816" y="128" width="26" height="34" rx="4"/>
      <rect x="850" y="128" width="26" height="34" rx="4"/>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="686" y1="140" x2="700" y2="140"/>
      <line x1="720" y1="140" x2="734" y2="140"/>
      <line x1="754" y1="140" x2="768" y2="140"/>
      <line x1="788" y1="140" x2="802" y2="140"/>
      <line x1="822" y1="140" x2="836" y2="140"/>
      <line x1="856" y1="140" x2="870" y2="140"/>
    </g>
    <g stroke="#475569" stroke-width="2" stroke-linecap="round">
      <line x1="686" y1="152" x2="694" y2="152"/>
      <line x1="720" y1="152" x2="732" y2="152"/>
      <line x1="754" y1="152" x2="762" y2="152"/>
      <line x1="788" y1="152" x2="800" y2="152"/>
      <line x1="822" y1="152" x2="830" y2="152"/>
      <line x1="856" y1="152" x2="868" y2="152"/>
    </g>

    <rect x="888" y="128" width="34" height="34" rx="8" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="905" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#94a3b8">?</text>
  </g>

  <!-- GCC output -->
  <g>
    <rect x="660" y="300" width="280" height="120" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="680" y="328" width="26" height="34" rx="4"/>
      <rect x="714" y="328" width="26" height="34" rx="4"/>
      <rect x="748" y="328" width="26" height="34" rx="4"/>
      <rect x="782" y="328" width="26" height="34" rx="4"/>
      <rect x="816" y="328" width="26" height="34" rx="4"/>
      <rect x="850" y="328" width="26" height="34" rx="4"/>
    </g>
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="686" y1="340" x2="700" y2="340"/>
      <line x1="720" y1="340" x2="734" y2="340"/>
      <line x1="754" y1="340" x2="768" y2="340"/>
      <line x1="788" y1="340" x2="802" y2="340"/>
      <line x1="822" y1="340" x2="836" y2="340"/>
      <line x1="856" y1="340" x2="870" y2="340"/>
    </g>
    <g stroke="#475569" stroke-width="2" stroke-linecap="round">
      <line x1="686" y1="352" x2="694" y2="352"/>
      <line x1="720" y1="352" x2="732" y2="352"/>
      <line x1="754" y1="352" x2="762" y2="352"/>
      <line x1="788" y1="352" x2="800" y2="352"/>
      <line x1="822" y1="352" x2="830" y2="352"/>
      <line x1="856" y1="352" x2="868" y2="352"/>
    </g>

    <rect x="888" y="328" width="34" height="34" rx="8" fill="#0b1220" stroke="#475569" stroke-width="2"/>
    <text x="905" y="354" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#94a3b8">?</text>
  </g>
</svg>
