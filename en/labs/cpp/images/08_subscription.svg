<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="subTitle subDesc">
  <title id="subTitle">Computing subscription cost with a percentage discount</title>
  <desc id="subDesc">A subscription plan of 20 per month with a 25% discount over 6 months yields a total cost of 90.</desc>

  <defs>
    <linearGradient id="subPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Plan card -->
  <g>
    <rect x="90" y="96" width="350" height="328" rx="18" fill="url(#subPanel)" stroke="#60a5fa" stroke-width="2"/>
    <text x="130" y="142" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Subscription plan</text>

    <line x1="130" y1="164" x2="400" y2="164" stroke="#1e293b" stroke-width="2"/>

    <text x="130" y="214" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">price / month</text>
    <text x="400" y="214" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e2e8f0">20</text>

    <text x="130" y="274" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">discount</text>
    <rect x="314" y="248" width="86" height="38" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="357" y="273" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#4ade80">−25%</text>

    <line x1="130" y1="312" x2="400" y2="312" stroke="#1e293b" stroke-width="2"/>

    <text x="130" y="362" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">duration</text>
    <rect x="272" y="336" width="128" height="38" rx="10" fill="#78350f" opacity="0.5" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="336" y="361" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fbbf24">6 months</text>
  </g>

  <!-- Plain arrow (no formula spoiler) -->
  <g>
    <line x1="466" y1="260" x2="594" y2="260" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <polygon points="592,251 608,260 592,269" fill="#64748b"/>
  </g>

  <!-- Right: Total cost example -->
  <g>
    <rect x="632" y="156" width="278" height="208" rx="20" fill="url(#subPanel)" stroke="#22c55e" stroke-width="2.5"/>
    <text x="771" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#4ade80">90</text>
    <text x="771" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#94a3b8">total cost</text>
  </g>
</svg>
