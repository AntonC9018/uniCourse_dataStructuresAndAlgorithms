<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="subTitle subDesc">
  <title id="subTitle">Computing subscription cost with a percentage discount</title>
  <desc id="subDesc">A subscription plan of 20 per month with a 25% discount over 6 months feeds into a final unknown total cost.</desc>

  <defs>
    <linearGradient id="subPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Plan card -->
  <g>
    <rect x="70" y="96" width="340" height="328" rx="18" fill="url(#subPanel)" stroke="#60a5fa" stroke-width="2"/>
    <text x="110" y="142" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">Subscription plan</text>

    <line x1="110" y1="164" x2="370" y2="164" stroke="#1e293b" stroke-width="2"/>

    <text x="110" y="214" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">price / month</text>
    <text x="370" y="214" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#e2e8f0">20</text>

    <text x="110" y="274" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">discount</text>
    <rect x="284" y="248" width="86" height="38" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="327" y="273" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#4ade80">−25%</text>

    <line x1="110" y1="312" x2="370" y2="312" stroke="#1e293b" stroke-width="2"/>

    <text x="110" y="362" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">duration</text>
    <rect x="242" y="336" width="128" height="38" rx="10" fill="#78350f" opacity="0.5" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="306" y="361" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#fbbf24">6 months</text>
  </g>

  <!-- Arrow + discount formula badge -->
  <g>
    <line x1="426" y1="260" x2="624" y2="260" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="622,251 638,260 622,269" fill="#60a5fa"/>
    <rect x="442" y="198" width="174" height="44" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="529" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">× (1 − d / 100)</text>
  </g>

  <!-- Right: Total cost -->
  <g>
    <rect x="652" y="160" width="278" height="200" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="791" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#60a5fa">?</text>
    <text x="791" y="302" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#94a3b8">total cost</text>
  </g>
</svg>
