<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="dishesTitle dishesDesc">
  <title id="dishesTitle">Soaking every dirty plate in rack 0</title>
  <desc id="dishesDesc">A kitchen has two racks with three plates each. Rack 0 is selected: its dirty plates receive water drops to soak, while its already soaked plate and all plates in rack 1 stay as they are.</desc>

  <defs>
    <linearGradient id="rackPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="plate">
      <circle cx="0" cy="0" r="46" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <g id="drop">
      <path d="M 0 0 C 0 0 10 13 10 19 A 10 10 0 0 1 -10 19 C -10 13 0 0 0 0 Z" fill="#60a5fa"/>
    </g>
    <g id="stain">
      <circle cx="-10" cy="-6" r="6" fill="#92400e"/>
      <circle cx="10" cy="8" r="7" fill="#78350f"/>
      <circle cx="6" cy="-12" r="4" fill="#92400e"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- rack 0, selected -->
  <g>
    <rect x="80" y="56" width="840" height="190" rx="16" fill="#78350f" opacity="0.22"/>
    <rect x="80" y="56" width="840" height="190" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="110" y="92" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#fbbf24">rack 0</text>

    <!-- plate 0: dirty -> soak -->
    <g transform="translate(260 156)">
      <use href="#plate"/>
      <use href="#stain"/>
      <use href="#drop" transform="translate(0 -76)"/>
      <line x1="0" y1="-44" x2="0" y2="-22" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-7,-24 0,-12 7,-24" fill="#60a5fa"/>
    </g>

    <!-- plate 1: already soaked -->
    <g transform="translate(500 156)">
      <use href="#plate"/>
      <circle cx="0" cy="0" r="30" fill="#60a5fa" opacity="0.25"/>
      <use href="#drop" transform="translate(-8 -12) scale(0.75)"/>
      <use href="#drop" transform="translate(12 -4) scale(0.65)"/>
    </g>

    <!-- plate 2: dirty -> soak -->
    <g transform="translate(740 156)">
      <use href="#plate"/>
      <use href="#stain" transform="rotate(90)"/>
      <use href="#drop" transform="translate(0 -76)"/>
      <line x1="0" y1="-44" x2="0" y2="-22" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      <polygon points="-7,-24 0,-12 7,-24" fill="#60a5fa"/>
    </g>
  </g>

  <!-- rack 1, untouched -->
  <g>
    <rect x="80" y="274" width="840" height="190" rx="16" fill="url(#rackPanel)" stroke="#334155" stroke-width="2"/>
    <text x="110" y="310" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">rack 1</text>

    <!-- plate 0: soaked -->
    <g transform="translate(260 374)">
      <use href="#plate"/>
      <circle cx="0" cy="0" r="30" fill="#60a5fa" opacity="0.25"/>
      <use href="#drop" transform="translate(0 -12) scale(0.75)"/>
    </g>

    <!-- plate 1: dirty -->
    <g transform="translate(500 374)">
      <use href="#plate"/>
      <use href="#stain"/>
    </g>

    <!-- plate 2: dirty -->
    <g transform="translate(740 374)">
      <use href="#plate"/>
      <use href="#stain" transform="rotate(140)"/>
    </g>
  </g>
</svg>
