<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="mixTitle mixDesc">
  <title id="mixTitle">Mixing two short recordings into a new one</title>
  <desc id="mixDesc">Two recordings of three samples each. The first is scaled to a quarter and the second to three quarters. For each sample position the scaled pieces are laid end to end and their sum is marked, giving minus 0.2, 0.4 and 0.5.</desc>

  <defs>
    <linearGradient id="mixPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- recording A -->
  <g>
    <rect x="60" y="30" width="400" height="175" rx="14" fill="url(#mixPanel)" stroke="#334155" stroke-width="2"/>
    <text x="80" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">recording 1</text>

    <line x1="90" y1="135" x2="430" y2="135" stroke="#475569" stroke-width="2"/>
    <rect x="140" y="95" width="40" height="40" rx="4" fill="#3b82f6"/>
    <rect x="250" y="135" width="40" height="80" rx="4" fill="#3b82f6"/>
    <rect x="360" y="55" width="40" height="80" rx="4" fill="#3b82f6"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" text-anchor="middle">
      <text x="160" y="85">0.4</text>
      <text x="270" y="233">−0.8</text>
      <text x="380" y="45">0.8</text>
    </g>

    <rect x="358" y="164" width="72" height="30" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="394" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#93c5fd">×25%</text>
  </g>

  <!-- recording B -->
  <g>
    <rect x="540" y="30" width="400" height="175" rx="14" fill="url(#mixPanel)" stroke="#334155" stroke-width="2"/>
    <text x="560" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">recording 2</text>

    <line x1="570" y1="135" x2="910" y2="135" stroke="#475569" stroke-width="2"/>
    <rect x="620" y="135" width="40" height="40" rx="4" fill="#22c55e"/>
    <rect x="730" y="55" width="40" height="80" rx="4" fill="#22c55e"/>
    <rect x="840" y="95" width="40" height="40" rx="4" fill="#22c55e"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#94a3b8" text-anchor="middle">
      <text x="640" y="193">−0.4</text>
      <text x="750" y="45">0.8</text>
      <text x="860" y="85">0.4</text>
    </g>

    <rect x="838" y="164" width="72" height="30" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="874" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#86efac">×75%</text>
  </g>

  <!-- per-sample stacking of the scaled pieces -->
  <g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">
      <text x="150" y="315">sample 0</text>
      <text x="150" y="390">sample 1</text>
      <text x="150" y="465">sample 2</text>
    </g>

    <!-- sample 0: 0 -> +0.1 -> -0.2 -->
    <g>
      <line x1="280" y1="310" x2="880" y2="310" stroke="#334155" stroke-width="2"/>
      <line x1="540" y1="292" x2="540" y2="328" stroke="#475569" stroke-width="2"/>
      <text x="540" y="348" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">0</text>
      <rect x="540" y="294" width="56" height="14" rx="4" fill="#3b82f6"/>
      <rect x="428" y="312" width="168" height="14" rx="4" fill="#22c55e"/>
      <line x1="596" y1="294" x2="596" y2="326" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="428" y1="292" x2="428" y2="328" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="428" cy="310" r="5" fill="#e2e8f0"/>
      <text x="416" y="332" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e2e8f0">−0.2</text>
    </g>

    <!-- sample 1: 0 -> -0.2 -> +0.4 -->
    <g>
      <line x1="280" y1="385" x2="880" y2="385" stroke="#334155" stroke-width="2"/>
      <line x1="540" y1="367" x2="540" y2="403" stroke="#475569" stroke-width="2"/>
      <text x="540" y="423" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">0</text>
      <rect x="428" y="387" width="112" height="14" rx="4" fill="#3b82f6"/>
      <rect x="428" y="369" width="336" height="14" rx="4" fill="#22c55e"/>
      <line x1="428" y1="369" x2="428" y2="401" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="764" y1="367" x2="764" y2="403" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="764" cy="385" r="5" fill="#e2e8f0"/>
      <text x="776" y="407" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e2e8f0">0.4</text>
    </g>

    <!-- sample 2: 0 -> +0.2 -> +0.5 -->
    <g>
      <line x1="280" y1="460" x2="880" y2="460" stroke="#334155" stroke-width="2"/>
      <line x1="540" y1="442" x2="540" y2="478" stroke="#475569" stroke-width="2"/>
      <text x="540" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">0</text>
      <rect x="540" y="444" width="112" height="14" rx="4" fill="#3b82f6"/>
      <rect x="652" y="444" width="168" height="14" rx="4" fill="#22c55e"/>
      <line x1="820" y1="442" x2="820" y2="478" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="820" cy="460" r="5" fill="#e2e8f0"/>
      <text x="832" y="482" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#e2e8f0">0.5</text>
    </g>
  </g>
</svg>
