<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="distTitle distDesc">
  <title id="distTitle">Euclidean distance between two points on a coordinate plane</title>
  <desc id="distDesc">Two points A at (1, 2) and B at (5, 5) on a coordinate grid, forming a right triangle with horizontal difference dx and vertical difference dy and an unknown diagonal distance.</desc>

  <defs>
    <linearGradient id="dstPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left coordinate grid (origin at 150, 400; 1 unit = 60px -> x: 0..6 -> 150..510, y: 0..6 -> 400..40) -->
  <g>
    <rect x="70" y="56" width="520" height="408" rx="20" fill="url(#dstPanel)" stroke="#334155" stroke-width="2"/>

    <!-- Grid lines (x=150..510 step 60, y=100..400 step 50) -->
    <g stroke="#1e293b" stroke-width="1.5">
      <line x1="210" y1="86" x2="210" y2="400"/>
      <line x1="270" y1="86" x2="270" y2="400"/>
      <line x1="330" y1="86" x2="330" y2="400"/>
      <line x1="390" y1="86" x2="390" y2="400"/>
      <line x1="450" y1="86" x2="450" y2="400"/>
      <line x1="510" y1="86" x2="510" y2="400"/>

      <line x1="150" y1="350" x2="540" y2="350"/>
      <line x1="150" y1="300" x2="540" y2="300"/>
      <line x1="150" y1="250" x2="540" y2="250"/>
      <line x1="150" y1="200" x2="540" y2="200"/>
      <line x1="150" y1="150" x2="540" y2="150"/>
      <line x1="150" y1="100" x2="540" y2="100"/>
    </g>

    <!-- Axes -->
    <line x1="150" y1="400" x2="554" y2="400" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="150" y1="400" x2="150" y2="78" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="552,394 564,400 552,406" fill="#64748b"/>
    <polygon points="144,80 150,68 156,80" fill="#64748b"/>
    <text x="564" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">x</text>
    <text x="128" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">y</text>

    <!-- Right-triangle legs: A(1,2) = (210, 300), B(5,5) = (450, 150), corner C(5,2) = (450, 300) -->
    <line x1="210" y1="300" x2="450" y2="300" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="450" y1="300" x2="450" y2="150" stroke="#4ade80" stroke-width="3" stroke-dasharray="7 5"/>
    <!-- Right-angle corner mark -->
    <polyline points="434,300 434,284 450,284" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Hypotenuse distance -->
    <line x1="210" y1="300" x2="450" y2="150" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Labels for dx, dy, and d=? -->
    <text x="330" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#60a5fa">dx = 5 − 1</text>
    <text x="466" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#4ade80">dy = 5 − 2</text>

    <circle cx="318" cy="206" r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="318" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fbbf24">?</text>

    <!-- Points A and B -->
    <circle cx="210" cy="300" r="8" fill="#60a5fa" stroke="#0b1220" stroke-width="2"/>
    <text x="200" y="330" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e2e8f0">A(1, 2)</text>

    <circle cx="450" cy="150" r="8" fill="#fbbf24" stroke="#0b1220" stroke-width="2"/>
    <text x="450" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#fbbf24">B(5, 5)</text>
  </g>

  <!-- Right: Formula & ? badge -->
  <g>
    <rect x="626" y="110" width="304" height="300" rx="20" fill="url(#dstPanel)" stroke="#334155" stroke-width="2"/>
    <text x="778" y="164" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">distance</text>

    <rect x="658" y="190" width="240" height="58" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="778" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#e2e8f0">√(dx² + dy²)</text>

    <rect x="710" y="286" width="136" height="82" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="778" y="338" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#60a5fa">?</text>
  </g>
</svg>
