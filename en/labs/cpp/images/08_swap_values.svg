<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="swapTitle swapDesc">
  <title id="swapTitle">Swapping the values of two variables</title>
  <desc id="swapDesc">Variables a with value 5 and b with value 9 swap their contents, so a becomes 9 and b becomes 5.</desc>

  <defs>
    <linearGradient id="swapPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Top curved swap arrow: a -> b -->
  <path d="M 230 164 Q 500 62 760 158" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="771.3,162.1 753.7,163.7 758.8,149.6" fill="#60a5fa"/>

  <!-- Bottom curved swap arrow: b -> a -->
  <path d="M 770 356 Q 500 458 240 362" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="228.7,357.9 246.3,356.3 241.2,370.4" fill="#f59e0b"/>

  <!-- Variable a: 5 -> 9 -->
  <g>
    <rect x="110" y="176" width="240" height="168" rx="20" fill="url(#swapPanel)" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="230" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">a</text>
    <text x="172" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#94a3b8">5</text>
    <text x="230" y="286" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#64748b">→</text>
    <rect x="256" y="250" width="66" height="54" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="289" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#4ade80">9</text>
  </g>

  <!-- Variable b: 9 -> 5 -->
  <g>
    <rect x="650" y="176" width="240" height="168" rx="20" fill="url(#swapPanel)" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="770" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">b</text>
    <text x="712" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#94a3b8">9</text>
    <text x="770" y="286" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#64748b">→</text>
    <rect x="796" y="250" width="66" height="54" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="829" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#4ade80">5</text>
  </g>
</svg>
