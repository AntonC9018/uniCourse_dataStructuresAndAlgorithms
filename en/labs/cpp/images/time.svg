<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="timeTitle timeDesc">
  <title id="timeTitle">Normalizing a time value</title>
  <desc id="timeDesc">A time of 4 hours 138 minutes 250 seconds normalized to 6 hours 22 minutes 10 seconds.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- clock icon top center -->
  <circle cx="500" cy="74" r="30" fill="#0b1220" stroke="#475569" stroke-width="3"/>
  <line x1="500" y1="74" x2="500" y2="54" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <line x1="500" y1="74" x2="518" y2="82" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="500" cy="74" r="4" fill="#cbd5e1"/>

  <!-- unnormalized panel -->
  <rect x="90" y="140" width="340" height="280" rx="20" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(140, 205)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#e2e8f0">4</text>
      <text x="40" y="0" font-size="22" fill="#94a3b8">h</text>
    </g>
    <g transform="translate(140, 285)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#f59e0b">138</text>
      <text x="92" y="0" font-size="22" fill="#f59e0b">min</text>
      <!-- subtle > 60 indicator -->
      <text x="160" y="-4" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#f59e0b" opacity="0.8">(&gt; 60)</text>
    </g>
    <g transform="translate(140, 365)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#ef4444">250</text>
      <text x="92" y="0" font-size="22" fill="#ef4444">s</text>
      <!-- subtle > 60 indicator -->
      <text x="140" y="-4" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ef4444" opacity="0.8">(&gt; 60)</text>
    </g>
  </g>

  <!-- arrow -->
  <g>
    <line x1="450" y1="280" x2="550" y2="280" stroke="#64748b" stroke-width="4"/>
    <polygon points="550,270 566,280 550,290" fill="#64748b"/>
  </g>

  <!-- normalized panel -->
  <rect x="570" y="140" width="340" height="280" rx="20" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(620, 205)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#e2e8f0">6</text>
      <text x="40" y="0" font-size="22" fill="#94a3b8">h</text>
    </g>
    <g transform="translate(620, 285)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#22c55e">22</text>
      <text x="68" y="0" font-size="22" fill="#22c55e">min</text>
    </g>
    <g transform="translate(620, 365)">
      <text x="0" y="0" font-size="44" font-weight="600" fill="#22c55e">10</text>
      <text x="68" y="0" font-size="22" fill="#22c55e">s</text>
    </g>
  </g>
</svg>
