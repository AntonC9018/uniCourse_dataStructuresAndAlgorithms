<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="dmgTitle dmgDesc">
  <title id="dmgTitle">Applying damage to a hero with health clamped at zero</title>
  <desc id="dmgDesc">A hero with 35 current health out of 100 maximum takes 50 damage, pushing health against a hard floor at zero so the final health cannot drop below 0.</desc>

  <defs>
    <linearGradient id="dmgPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Before hero card -->
  <g>
    <rect x="70" y="96" width="310" height="328" rx="18" fill="url(#dmgPanel)" stroke="#334155" stroke-width="2"/>
    <circle cx="225" cy="166" r="34" fill="#0f172a" stroke="#4ade80" stroke-width="2.5"/>
    <!-- Heart icon -->
    <path d="M 225 182 C 209 170 207 156 216 151 C 221 148 225 153 225 156 C 225 153 229 148 234 151 C 243 156 241 170 225 182 Z" fill="#ef4444"/>
    <text x="225" y="232" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">hero</text>

    <!-- Health bar 35 / 100 -->
    <rect x="108" y="266" width="234" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="110" y="268" width="82" height="18" rx="9" fill="#22c55e"/>
    <text x="225" y="324" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#e2e8f0">35 / 100</text>
    <text x="225" y="354" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">current / max</text>
  </g>

  <!-- Damage arrow -->
  <g>
    <line x1="396" y1="260" x2="584" y2="260" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="582,251 598,260 582,269" fill="#ef4444"/>
    <rect x="424" y="200" width="136" height="44" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="492" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#f87171">−50 dmg</text>
  </g>

  <!-- After hero card with 0 floor clamp -->
  <g>
    <rect x="614" y="96" width="316" height="328" rx="18" fill="url(#dmgPanel)" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="772" cy="166" r="34" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 772 182 C 756 170 754 156 763 151 C 768 148 772 153 772 156 C 772 153 776 148 781 151 C 790 156 788 170 772 182 Z" fill="#ef4444" opacity="0.45"/>

    <!-- Hard floor wall at 0 -->
    <line x1="654" y1="254" x2="654" y2="300" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <text x="654" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24">0</text>
    <rect x="664" y="266" width="226" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Unknown result >= 0 -->
    <rect x="706" y="324" width="132" height="48" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="772" y="355" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">? / 100</text>
    <text x="772" y="398" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">&gt;= 0</text>
  </g>
</svg>
