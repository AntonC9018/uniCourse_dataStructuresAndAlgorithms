<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="leverTitle leverDesc">
  <title id="leverTitle">Two-position lever with set and toggle operations</title>
  <desc id="leverDesc">A mechanical lever switch with positions 0 and 1, currently at 0, alongside operations to set position 0, set position 1, or toggle between 0 and 1.</desc>

  <defs>
    <linearGradient id="leverPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left panel: Lever physical state -->
  <g>
    <rect x="70" y="76" width="380" height="368" rx="20" fill="url(#leverPanel)" stroke="#334155" stroke-width="2"/>

    <!-- Position 1 (top) -->
    <g>
      <text x="158" y="153" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#64748b">pos 1</text>
      <circle cx="204" cy="146" r="24" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="204" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#94a3b8">1</text>
    </g>

    <!-- Position 0 (bottom, active) -->
    <g>
      <text x="158" y="371" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#fbbf24">current</text>
      <circle cx="204" cy="364" r="24" fill="#78350f" opacity="0.55" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="204" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">0</text>
    </g>

    <!-- Pivot housing and lever arm -->
    <rect x="316" y="220" width="84" height="70" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="358" cy="255" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2.5"/>
    <!-- Ghost arm at 1 -->
    <line x1="358" y1="255" x2="274" y2="152" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8"/>
    <circle cx="274" cy="152" r="14" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- Active arm at 0 -->
    <line x1="358" y1="255" x2="274" y2="358" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="274" cy="358" r="18" fill="#f59e0b" stroke="#fbbf24" stroke-width="2.5"/>
  </g>

  <!-- Right panel: 3 operations -->
  <g>
    <!-- set(0) -> stays 0 -->
    <rect x="500" y="76" width="430" height="104" rx="16" fill="url(#leverPanel)" stroke="#334155" stroke-width="2"/>
    <rect x="524" y="104" width="112" height="48" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="580" y="135" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#cbd5e1">set(0)</text>
    <text x="668" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">0 → 0</text>
    <rect x="760" y="108" width="146" height="40" rx="20" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="833" y="133" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">unchanged</text>

    <!-- set(1) -> moves to 1 -->
    <rect x="500" y="208" width="430" height="104" rx="16" fill="url(#leverPanel)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="524" y="236" width="112" height="48" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="580" y="267" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#60a5fa">set(1)</text>
    <text x="668" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">0 → 1</text>
    <rect x="760" y="240" width="146" height="40" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="833" y="265" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#60a5fa">pos = 1</text>

    <!-- toggle() -> flips 0 <-> 1 -->
    <rect x="500" y="340" width="430" height="104" rx="16" fill="#78350f" opacity="0.22"/>
    <rect x="500" y="340" width="430" height="104" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="524" y="368" width="112" height="48" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="580" y="399" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#fbbf24">toggle()</text>
    <text x="668" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">0 ↔ 1</text>
    <circle cx="833" cy="392" r="24" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="833" y="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">?</text>
  </g>
</svg>
