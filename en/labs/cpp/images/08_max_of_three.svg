<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="max3Title max3Desc">
  <title id="max3Title">Finding the maximum of three numbers using two-argument std::max</title>
  <desc id="max3Desc">Three numbers 14, 42, and 27 enter a two-step std::max comparison: first comparing 14 and 42, then comparing that winner against 27 to produce an unknown maximum.</desc>

  <defs>
    <linearGradient id="m3Panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Three input cards on the left -->
  <g>
    <rect x="80" y="74" width="150" height="96" rx="16" fill="url(#m3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="155" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">a</text>
    <text x="155" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#e2e8f0">14</text>

    <rect x="80" y="212" width="150" height="96" rx="16" fill="#78350f" opacity="0.28"/>
    <rect x="80" y="212" width="150" height="96" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="155" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">b</text>
    <text x="155" y="282" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#fbbf24">42</text>

    <rect x="80" y="350" width="150" height="96" rx="16" fill="url(#m3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="155" y="378" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">c</text>
    <text x="155" y="420" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700" fill="#e2e8f0">27</text>
  </g>

  <!-- Stage 1: std::max(a, b) -->
  <g>
    <path d="M 230 122 H 310 V 170 H 346" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230 260 H 310 V 212 H 346" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="344,162 358,170 344,178" fill="#64748b"/>
    <polygon points="344,204 358,212 344,220" fill="#f59e0b"/>

    <rect x="362" y="136" width="180" height="110" rx="16" fill="url(#m3Panel)" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="452" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#60a5fa">std::max</text>
    <rect x="412" y="190" width="80" height="36" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="452" y="214" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#60a5fa">?</text>
  </g>

  <!-- Stage 2: std::max(stage1, c) -->
  <g>
    <path d="M 542 191 H 592 V 274 H 614" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230 398 H 592 V 318 H 614" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="612,266 626,274 612,282" fill="#60a5fa"/>
    <polygon points="612,310 626,318 612,326" fill="#64748b"/>

    <rect x="630" y="242" width="180" height="110" rx="16" fill="url(#m3Panel)" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="720" y="280" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#60a5fa">std::max</text>
    <text x="720" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">2 inputs only</text>
  </g>

  <!-- Output result -->
  <g>
    <line x1="810" y1="297" x2="846" y2="297" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <polygon points="844,289 858,297 844,305" fill="#60a5fa"/>

    <rect x="862" y="242" width="84" height="110" rx="16" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="904" y="308" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#60a5fa">?</text>
  </g>
</svg>
