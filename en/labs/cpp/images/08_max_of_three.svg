<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="max3Title max3Desc">
  <title id="max3Title">Maximum of three numbers example</title>
  <desc id="max3Desc">Three input numbers 14, 42, and 27 yield 42 as their maximum value.</desc>

  <defs>
    <linearGradient id="m3Panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Three input cards on the left -->
  <g>
    <rect x="120" y="74" width="210" height="96" rx="16" fill="url(#m3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="225" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#e2e8f0">14</text>

    <rect x="120" y="212" width="210" height="96" rx="16" fill="#78350f" opacity="0.28"/>
    <rect x="120" y="212" width="210" height="96" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="225" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#fbbf24">42</text>

    <rect x="120" y="350" width="210" height="96" rx="16" fill="url(#m3Panel)" stroke="#334155" stroke-width="2"/>
    <text x="225" y="410" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#e2e8f0">27</text>
  </g>

  <!-- Merging lines + arrow -->
  <g>
    <path d="M 330 122 H 440 V 260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="260" x2="588" y2="260" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 330 398 H 440 V 260" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="586,251 602,260 586,269" fill="#f59e0b"/>
  </g>

  <!-- Right: Output maximum example -->
  <g>
    <rect x="614" y="156" width="260" height="208" rx="22" fill="#052e16" opacity="0.4"/>
    <rect x="614" y="156" width="260" height="208" rx="22" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <text x="744" y="210" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#4ade80">max</text>
    <text x="744" y="294" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#4ade80">42</text>
  </g>
</svg>
