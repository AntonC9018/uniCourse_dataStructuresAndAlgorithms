<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="tuneCarTitle tuneCarDesc">
  <title id="tuneCarTitle">Tuning car 2 in a four-car garage</title>
  <desc id="tuneCarDesc">A garage holds four cars with model names, power in horsepower and prices. Car 2 is selected for tuning: ten horsepower are added, and one thousand dollars are added to the price for each added horsepower. The new power and price are unknown.</desc>

  <defs>
    <linearGradient id="garagePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <g id="carSilhouette">
      <path d="M 14 34 L 24 14 Q 28 10 34 10 H 72 Q 78 10 82 14 L 94 34 H 104 Q 110 34 110 40 V 52 H 4 V 40 Q 4 34 10 34 Z" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 28 15 H 52 V 32 H 20 Z" fill="#0b1220" opacity="0.65"/>
      <path d="M 56 15 H 76 L 86 32 H 56 Z" fill="#0b1220" opacity="0.65"/>
      <circle cx="28" cy="54" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="86" cy="54" r="10" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- garage outer frame -->
  <rect x="44" y="48" width="912" height="424" rx="18" fill="url(#garagePanel)" stroke="#334155" stroke-width="2"/>

  <!-- car 0 -->
  <g>
    <rect x="66" y="74" width="202" height="372" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="84" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">0</text>
    <text x="167" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Civic</text>
    <use href="#carSilhouette" transform="translate(110 132)" fill="#475569" stroke="#64748b"/>
    <text x="86" y="246" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">power</text>
    <text x="248" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">110 hp</text>
    <text x="86" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">price</text>
    <text x="248" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">$12000</text>
  </g>

  <!-- car 1 -->
  <g>
    <rect x="288" y="74" width="202" height="372" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="306" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">1</text>
    <text x="389" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Golf</text>
    <use href="#carSilhouette" transform="translate(332 132)" fill="#3b82f6" stroke="#60a5fa"/>
    <text x="308" y="246" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">power</text>
    <text x="470" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">150 hp</text>
    <text x="308" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">price</text>
    <text x="470" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">$18000</text>
  </g>

  <!-- car 2, selected for tuning -->
  <g>
    <rect x="510" y="74" width="202" height="372" rx="14" fill="#78350f" opacity="0.28"/>
    <rect x="510" y="74" width="202" height="372" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="528" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#fbbf24">2</text>
    <text x="611" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#fbbf24">Supra</text>
    <use href="#carSilhouette" transform="translate(554 132)" fill="#f59e0b" stroke="#fbbf24"/>

    <text x="530" y="244" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#fbbf24">power</text>
    <text x="692" y="244" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">250 hp</text>
    <rect x="530" y="256" width="84" height="28" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="572" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#fbbf24">+10 hp</text>
    <text x="626" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">→</text>
    <rect x="646" y="256" width="46" height="28" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="669" y="276" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#60a5fa">?</text>

    <text x="530" y="318" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#fbbf24">price</text>
    <text x="692" y="318" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">$35000</text>
    <rect x="530" y="330" width="162" height="28" rx="7" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="611" y="349" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#fbbf24">+$1000 / hp</text>

    <rect x="556" y="378" width="110" height="44" rx="22" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="611" y="407" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#60a5fa">$?</text>
  </g>

  <!-- car 3 -->
  <g>
    <rect x="732" y="74" width="202" height="372" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="750" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#64748b">3</text>
    <text x="833" y="104" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Polo</text>
    <use href="#carSilhouette" transform="translate(776 132)" fill="#22c55e" stroke="#4ade80"/>
    <text x="752" y="246" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">power</text>
    <text x="914" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">95 hp</text>
    <text x="752" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#64748b">price</text>
    <text x="914" y="290" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#cbd5e1">$10000</text>
  </g>
</svg>
