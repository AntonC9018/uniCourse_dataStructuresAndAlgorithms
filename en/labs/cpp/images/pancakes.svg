<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="pancakeTitle pancakeDesc">
  <title id="pancakeTitle">Making pancakes from the ingredients in the fridge</title>
  <desc id="pancakeDesc">An open fridge holding three eggs and a carton of kefir, labelled X = 3 and Y = 500 ml, a recipe card for one egg and 250 millilitres of kefir per eight pancakes, and a plate of pancakes.</desc>

  <defs>
    <linearGradient id="fridgeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3648"/>
      <stop offset="100%" stop-color="#16202e"/>
    </linearGradient>
    <linearGradient id="pancake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a13a"/>
      <stop offset="100%" stop-color="#c26a0c"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- fridge -->
  <rect x="70" y="55" width="310" height="405" rx="18" fill="url(#fridgeBody)" stroke="#64748b" stroke-width="3"/>
  <rect x="86" y="71" width="278" height="373" rx="8" fill="#0b1220" stroke="#0f172a" stroke-width="2"/>
  <line x1="86" y1="225" x2="364" y2="225" stroke="#475569" stroke-width="4"/>
  <line x1="86" y1="345" x2="364" y2="345" stroke="#475569" stroke-width="4"/>
  <rect x="100" y="460" width="24" height="12" rx="3" fill="#334155"/>
  <rect x="326" y="460" width="24" height="12" rx="3" fill="#334155"/>

  <!-- snowflake -->
  <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <line x1="336" y1="96" x2="336" y2="120"/>
    <line x1="326" y1="102" x2="346" y2="114"/>
    <line x1="346" y1="102" x2="326" y2="114"/>
    <line x1="332" y1="99" x2="336" y2="103"/>
    <line x1="340" y1="99" x2="336" y2="103"/>
    <line x1="332" y1="117" x2="336" y2="113"/>
    <line x1="340" y1="117" x2="336" y2="113"/>
  </g>

  <!-- eggs -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <ellipse cx="265" cy="206" rx="15" ry="19"/>
    <ellipse cx="305" cy="206" rx="15" ry="19"/>
    <ellipse cx="345" cy="206" rx="15" ry="19"/>
  </g>

  <!-- kefir carton -->
  <polygon points="290,265 320,242 350,265" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect x="315" y="238" width="10" height="7" rx="2" fill="#60a5fa"/>
  <rect x="290" y="265" width="60" height="80" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="290" y="292" width="60" height="22" fill="#3b82f6"/>

  <!-- labels with leader lines -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="110" y="200" font-size="19" fill="#e2e8f0">X = 3</text>
    <text x="110" y="310" font-size="17" fill="#e2e8f0">Y = 500 ml</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="176" y1="195" x2="243" y2="204"/>
    <line x1="206" y1="305" x2="282" y2="305"/>
  </g>
  <circle cx="243" cy="204" r="2.5" fill="#94a3b8"/>
  <circle cx="282" cy="305" r="2.5" fill="#94a3b8"/>

  <!-- arrow to the recipe -->
  <line x1="392" y1="255" x2="446" y2="255" stroke="#64748b" stroke-width="3"/>
  <polygon points="446,247 460,255 446,263" fill="#64748b"/>

  <!-- recipe card -->
  <rect x="474" y="134" width="236" height="276" rx="14" fill="#000000" opacity="0.35"/>
  <rect x="468" y="128" width="236" height="276" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="586" y="200" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="27" font-weight="600" fill="#1e293b">1 egg</text>
  <text x="586" y="244" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#334155">+ 250 ml kefir</text>
  <line x1="492" y1="272" x2="680" y2="272" stroke="#cbd5e1" stroke-width="2"/>
  <text x="586" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="23" font-weight="700" fill="#b45309">= 8 pancakes</text>

  <!-- arrow to the plate -->
  <line x1="712" y1="318" x2="780" y2="366" stroke="#64748b" stroke-width="3"/>
  <polygon points="773,371 790,375 781,359" fill="#64748b"/>

  <!-- plate of pancakes -->
  <ellipse cx="850" cy="452" rx="118" ry="14" fill="#000000" opacity="0.4"/>
  <ellipse cx="850" cy="428" rx="112" ry="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <ellipse cx="850" cy="426" rx="86" ry="14" fill="#f8fafc"/>
  <g stroke="#b45309" stroke-width="2">
    <ellipse cx="850" cy="406" rx="66" ry="16.5" fill="url(#pancake)"/>
    <ellipse cx="850" cy="392" rx="66" ry="16.5" fill="url(#pancake)"/>
    <ellipse cx="850" cy="378" rx="66" ry="16.5" fill="url(#pancake)"/>
    <ellipse cx="850" cy="364" rx="66" ry="16.5" fill="#f0a13a"/>
  </g>
  <ellipse cx="850" cy="360" rx="56" ry="11" fill="#fbbf24" opacity="0.5"/>
  <rect x="838" y="348" width="26" height="11" rx="3" fill="#fde68a" stroke="#eab308" stroke-width="1.5"/>
  <path d="M851 358 L 851 370" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M820 338 C 810 324 828 314 818 300"/>
    <path d="M868 338 C 858 324 876 314 866 300"/>
  </g>
</svg>
