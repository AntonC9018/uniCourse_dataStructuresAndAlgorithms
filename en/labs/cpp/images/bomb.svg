<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="bombTitle bombDesc">
  <title id="bombTitle">A bomb with its characteristics</title>
  <desc id="bombDesc">A block of plastic explosive with a circuit board taped on. The board holds a timer, a keypad, an indicator bulb and a lever switch. A framed portrait and a numbered dial sit next to it, and three wires loop over the top.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dccca4"/>
      <stop offset="55%" stop-color="#c8b387"/>
      <stop offset="100%" stop-color="#ab946a"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3dd93"/>
      <stop offset="100%" stop-color="#8fb45c"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7a8d"/>
      <stop offset="100%" stop-color="#2b3542"/>
    </linearGradient>
    <radialGradient id="glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portraitBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#243449"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <clipPath id="portraitClip">
      <rect x="248" y="238" width="144" height="164"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="618" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <ellipse cx="500" cy="572" rx="315" ry="13" fill="#000000" opacity="0.45"/>

  <!-- explosive block -->
  <rect x="200" y="210" width="600" height="350" rx="18" fill="url(#paper)" stroke="#8a7448" stroke-width="3"/>
  <rect x="206" y="216" width="588" height="338" rx="14" fill="none" stroke="#efe0bd" stroke-width="1.5" opacity="0.45"/>
  <g fill="none" stroke="#a8946a" stroke-width="2" opacity="0.7">
