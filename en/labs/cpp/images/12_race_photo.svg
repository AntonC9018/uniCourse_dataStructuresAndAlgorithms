<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="raceTitle raceDesc">
  <title id="raceTitle">A photo taken at the finish line of a 100 meter race</title>
  <desc id="raceDesc">Three runners start a 100 meter race with times of 10, 12 and 15 seconds. A camera at the finish line takes a photo 10 seconds after the start. The remaining distances for the two slower runners are unknown.</desc>

  <defs>
    <linearGradient id="lanePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#e2e8f0"/>
      <rect width="10" height="10" fill="#0f172a"/>
      <rect x="10" y="10" width="10" height="10" fill="#0f172a"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- distance dimension -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="180" y1="112" x2="850" y2="112"/>
    <line x1="180" y1="102" x2="180" y2="122"/>
    <line x1="850" y1="102" x2="850" y2="122"/>
  </g>
  <text x="515" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#cbd5e1">100 m</text>

  <!-- track lanes -->
  <g>
    <rect x="100" y="130" width="800" height="80" rx="10" fill="url(#lanePanel)" stroke="#334155" stroke-width="2"/>
    <rect x="100" y="230" width="800" height="80" rx="10" fill="url(#lanePanel)" stroke="#334155" stroke-width="2"/>
    <rect x="100" y="330" width="800" height="80" rx="10" fill="url(#lanePanel)" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- start and finish -->
  <line x1="180" y1="126" x2="180" y2="414" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="840" y="130" width="30" height="280" fill="url(#checker)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- runner 0 -->
  <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="232" cy="142" r="10" fill="#60a5fa" stroke="none"/>
    <line x1="232" y1="152" x2="232" y2="176"/>
    <line x1="232" y1="160" x2="214" y2="170"/>
    <line x1="232" y1="160" x2="250" y2="168"/>
    <line x1="232" y1="176" x2="216" y2="196"/>
    <line x1="232" y1="176" x2="248" y2="194"/>
  </g>
  <text x="300" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#cbd5e1">10 s</text>

  <!-- runner 1 -->
  <g stroke="#4ade80" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="232" cy="242" r="10" fill="#4ade80" stroke="none"/>
    <line x1="232" y1="252" x2="232" y2="276"/>
    <line x1="232" y1="260" x2="214" y2="270"/>
    <line x1="232" y1="260" x2="250" y2="268"/>
    <line x1="232" y1="276" x2="216" y2="296"/>
    <line x1="232" y1="276" x2="248" y2="294"/>
  </g>
  <text x="300" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#cbd5e1">12 s</text>

  <!-- runner 2 -->
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="232" cy="342" r="10" fill="#fbbf24" stroke="none"/>
    <line x1="232" y1="352" x2="232" y2="376"/>
    <line x1="232" y1="360" x2="214" y2="370"/>
    <line x1="232" y1="360" x2="250" y2="368"/>
    <line x1="232" y1="376" x2="216" y2="396"/>
    <line x1="232" y1="376" x2="248" y2="394"/>
  </g>
  <text x="300" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#cbd5e1">15 s</text>

  <!-- remaining distance questions -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="600" text-anchor="middle">
    <rect x="716" y="248" width="86" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="759" y="279" fill="#60a5fa">? m</text>
    <rect x="716" y="348" width="86" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="759" y="379" fill="#60a5fa">? m</text>
  </g>

  <!-- camera at the finish -->
  <g>
    <rect x="830" y="446" width="50" height="34" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="842" y="438" width="18" height="10" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="855" cy="463" r="11" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="855" cy="463" r="4" fill="#60a5fa"/>
    <rect x="866" y="450" width="8" height="6" rx="1" fill="#fbbf24"/>
    <text x="900" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#fbbf24">10 s</text>
  </g>
</svg>
