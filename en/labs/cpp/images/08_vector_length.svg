<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="vecTitle vecDesc">
  <title id="vecTitle">Length of a 2D vector example</title>
  <desc id="vecDesc">A 2D coordinate grid showing vector (3, 4) from the origin with length 5, alongside the zero vector (0, 0) with length 0.</desc>

  <defs>
    <linearGradient id="vecPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132033"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="518" rx="24" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Coordinate axes with vector (3, 4) -->
  <g>
    <rect x="70" y="56" width="520" height="408" rx="20" fill="url(#vecPanel)" stroke="#334155" stroke-width="2"/>

    <!-- Grid lines (origin at 160, 400; 1 unit x = 75px, 1 unit y = 60px) -->
    <g stroke="#1e293b" stroke-width="1.5">
      <line x1="235" y1="86" x2="235" y2="400"/>
      <line x1="310" y1="86" x2="310" y2="400"/>
      <line x1="385" y1="86" x2="385" y2="400"/>
      <line x1="460" y1="86" x2="460" y2="400"/>

      <line x1="160" y1="340" x2="536" y2="340"/>
      <line x1="160" y1="280" x2="536" y2="280"/>
      <line x1="160" y1="220" x2="536" y2="220"/>
      <line x1="160" y1="160" x2="536" y2="160"/>
      <line x1="160" y1="100" x2="536" y2="100"/>
    </g>

    <!-- Axes -->
    <line x1="160" y1="400" x2="548" y2="400" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="400" x2="160" y2="78" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="546,394 558,400 546,406" fill="#64748b"/>
    <polygon points="154,80 160,68 166,80" fill="#64748b"/>
    <text x="558" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">x</text>
    <text x="136" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">y</text>

    <!-- Dashed projection guides for x = 3, y = 4 -->
    <line x1="160" y1="400" x2="385" y2="400" stroke="#60a5fa" stroke-width="3.5" stroke-dasharray="7 5"/>
    <line x1="385" y1="400" x2="385" y2="160" stroke="#4ade80" stroke-width="3.5" stroke-dasharray="7 5"/>

    <!-- Vector arrow from (160, 400) to (385, 160) -->
    <line x1="160" y1="400" x2="374" y2="172" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="385,160 367.2,168.0 378.2,178.2" fill="#f59e0b"/>

    <!-- Origin (0,0) dot -->
    <circle cx="160" cy="400" r="7" fill="#94a3b8" stroke="#0b1220" stroke-width="2"/>
    <text x="148" y="426" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">(0, 0)</text>

    <!-- Vector tip label -->
    <text x="396" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#fbbf24">v = (3, 4)</text>

    <!-- Component labels -->
    <text x="272" y="428" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#60a5fa">x = 3</text>
    <text x="404" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#4ade80">y = 4</text>
  </g>

  <!-- Right: Two concrete length examples (no formula spoiler) -->
  <g>
    <rect x="626" y="110" width="304" height="136" rx="18" fill="url(#vecPanel)" stroke="#f59e0b" stroke-width="2"/>
    <text x="664" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#fbbf24">(3, 4)</text>
    <text x="774" y="185" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64748b">→</text>
    <rect x="810" y="148" width="84" height="58" rx="14" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="852" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#4ade80">5</text>

    <rect x="626" y="274" width="304" height="136" rx="18" fill="url(#vecPanel)" stroke="#334155" stroke-width="2"/>
    <text x="664" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#cbd5e1">(0, 0)</text>
    <text x="774" y="349" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64748b">→</text>
    <rect x="810" y="312" width="84" height="58" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="852" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#60a5fa">0</text>
  </g>
</svg>
