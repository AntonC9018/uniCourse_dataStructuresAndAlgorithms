# Course-owned GitHub triggers, permissions, artifact upload and Pages deploy.
# Reusable setup, validation and smoke checks come from the pinned submodule.
# All course policy lives in course-publishing.json.
name: course-site

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

# CI-9: read-only by default. Deploy job escalates to pages:write +
# id-token:write for a successful master build only.
permissions:
  contents: read

# CI-10: same-ref group, cancel superseded. A newer master push cancels a
# still-running older run, so the older build can never upload/deploy after
# the newer revision. PR pushes cancel prior runs on the same PR branch.
concurrency:
  group: course-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # CI-2/CI-6: pinned submodule at the committed revision.
      - name: Checkout course with pinned maintenance submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0

      # Setup, cache keys, PR readiness, and validation belong to the
      # pinned shared tooling. Course policy lives in course-publishing.json.
      - name: Course document validation and site build
        uses: ./course_maintenance/.github/actions/course-ci
        with:
          out: ${{ runner.temp }}/site-out

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Upload the exact validated build (CI-4). PR runs skip this step
      # (CI-3: PRs never deploy); a failed validation stops the job here
      # so nothing uploads and deploy never runs.
      - name: Upload Pages artifact (exact validated build)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site-out/dist
          # Preserve the generated .nojekyll file for Pagefind assets.
          include-hidden-files: true

  deploy:
    # CI-4: pushes to master only (direct commits + PR merges). PRs never
    # reach this job; failed validation never reaches it via needs:.
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    # CI-11: bounded-retry post-deploy checks against the public Pages URL.
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course with pinned smoke tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Post-deploy smoke tests (bounded retry)
        run: python3 course_maintenance/publish.py smoke check --course-repo .
